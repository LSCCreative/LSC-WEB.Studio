name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's starter workflow has it: deploy-pages run in the same job
# as the upload can look for the artifact before it is listed and find none
# (actions/deploy-pages#451; it failed three times in a row on 2026-11-27). By the
# time a second job starts, the upload is always there. Re-running a failed run
# doesn't help either: it uploads a second artifact, and deploy refuses two.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Allow-list: only these paths reach the public site. Docs, planning files and
      # nas/ stay out. A new public file or folder has to be added here to go live.
      # The portal's design tokens and their fonts come from the admin at deploy (C2),
      # so the two products share one file. scripts/ itself is never published.
      - name: Copy the design tokens into the portal
        run: sh scripts/copy-portal-tokens.sh

      - name: Copy public site files
        run: |
          mkdir _site
          cp -R index.html faq.html CNAME css js assets client-hub-app _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
