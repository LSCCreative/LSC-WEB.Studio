<!DOCTYPE html>
<html lang="en">
<head>

<title>Client Portal — LSC Creative</title>

<!-- The design tokens: a copy of admin/web/css/tokens.css made at deploy (and by
     scripts/copy-portal-tokens.sh locally), never edited here. It also brings the
     Funnel Sans and CS Felice Mono font files, copied into fonts/ beside it. -->
<link rel="stylesheet" href="css/tokens.css">
<style>
  /* The portal's own stylesheet (merge safeguard S6: no third-party styling script).
     Every colour, size and font comes from tokens.css; nothing below 11px. */
  @font-face{font-family:'Delight';src:url('../assets/fonts/delight/Delight-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100vh;
    background:var(--color-bg-page); color:var(--color-text-primary);
    font-family:var(--font-family-body); font-size:var(--font-size-md); line-height:var(--line-height-normal);
  }
  ::selection{ background:var(--color-accent-primary); color:var(--color-text-on-accent); }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  a{ color:inherit; }
  img,video{ display:block; }
  [hidden]{ display:none !important; }

  /* ---- type ---- */
  .mono{ font-family:var(--font-family-mono); letter-spacing:var(--letter-spacing-wide); }
  .display{ font-family:var(--font-family-display); font-weight:var(--font-weight-semibold); line-height:var(--line-height-tight); letter-spacing:var(--letter-spacing-tight); }
  .eyebrow{ font:var(--eyebrow-font); letter-spacing:var(--letter-spacing-wide); text-transform:uppercase; color:var(--eyebrow-color); }
  .meta{ font-family:var(--font-family-mono); font-size:var(--font-size-xs); letter-spacing:var(--letter-spacing-wide); color:var(--color-text-tertiary); }
  .text-sm{ font-size:var(--font-size-base); }
  .muted{ color:var(--color-text-secondary); }
  .title-xl{ font-size:var(--font-size-xl); }
  .title-lg{ font-size:var(--font-size-lg); }
  .title-2xl{ font-size:var(--font-size-2xl); }

  /* ---- layout ---- */
  .wrap{ max-width:var(--max-width-wide); margin:0 auto; padding:0 var(--space-7); }
  .wrap-narrow{ max-width:768px; margin:0 auto; padding:0 var(--space-7); }
  .section{ padding-top:var(--space-9); padding-bottom:var(--space-9); }
  .center-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:var(--space-10) var(--space-7); text-align:center;
  }
  .stack-xs > * + *{ margin-top:var(--space-2); }
  .row{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-5); }
  .spread{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-5); }
  .min-0{ min-width:0; }
  .mt-2{ margin-top:var(--space-4); } .mt-3{ margin-top:var(--space-5); } .mt-4{ margin-top:var(--space-6); } .mt-6{ margin-top:var(--space-7); } .mt-8{ margin-top:var(--space-8); }
  .mb-2{ margin-bottom:var(--space-4); } .mb-3{ margin-bottom:var(--space-5); } .mb-4{ margin-bottom:var(--space-6); } .mb-6{ margin-bottom:var(--space-7); } .mb-8{ margin-bottom:var(--space-8); }
  .w-form{ width:100%; max-width:320px; }

  /* ---- surfaces ---- */
  .card{ background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--panel-radius); }
  .pad{ padding:var(--space-7); }
  .pad-sm{ padding:var(--space-6); }
  .pad-xs{ padding:var(--space-5); }
  .notice{ display:flex; align-items:flex-start; gap:var(--space-5); }

  /* ---- fields and buttons ---- */
  .field{
    width:100%; padding:10px 12px;
    background:var(--input-bg); color:var(--color-text-primary);
    border:1px solid var(--input-border); border-radius:var(--input-radius);
    font-family:var(--font-family-body); font-size:var(--font-size-base);
  }
  .field::placeholder{ color:var(--color-text-tertiary); }
  .field:focus{ outline:none; border-color:var(--color-border-focus); box-shadow:var(--shadow-focus); }
  .field.invalid{ border-color:var(--color-status-error); }
  .field-code{ text-align:center; font-family:var(--font-family-mono); font-size:var(--font-size-lg); letter-spacing:0.4em; }
  textarea.field{ resize:vertical; line-height:var(--line-height-normal); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:var(--space-3);
    min-height:var(--control-h); padding:0 var(--btn-pad-x);
    font:var(--btn-font); text-transform:var(--btn-transform); letter-spacing:var(--btn-tracking);
    border:1px solid var(--color-border-subtle); border-radius:var(--btn-radius);
    background:var(--color-accent-secondary); color:var(--color-text-primary);
    text-decoration:none; transition:background var(--duration-fast) var(--easing-default), border-color var(--duration-fast) var(--easing-default), color var(--duration-fast) var(--easing-default);
  }
  .btn:hover{ border-color:var(--color-border-strong); }
  .btn:focus-visible, .link:focus-visible, .tab:focus-visible, .asset-card:focus-visible, .photo-tile:focus-visible{ outline:none; box-shadow:var(--shadow-focus); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--color-accent-primary); border-color:transparent; color:var(--color-text-on-accent); }
  .btn-primary:hover{ background:var(--color-accent-primary-hover); border-color:transparent; }
  .btn-primary:active{ background:var(--color-accent-primary-active); }
  .btn-confirm{ border-color:var(--color-accent-confirm); color:var(--color-accent-confirm); }
  .btn-confirm:hover{ border-color:var(--color-accent-confirm); background:var(--color-bg-hover); }
  .btn-quiet{ color:var(--color-text-secondary); }
  .btn-quiet:hover{ color:var(--color-text-primary); }
  .btn-lg{ min-height:48px; padding:0 var(--space-8); font-size:var(--font-size-base); }
  .btn-icon{ min-height:0; width:var(--target-min); height:var(--target-min); padding:0; }
  .btn-block{ width:100%; }
  .link{
    font-family:var(--font-family-mono); font-size:var(--font-size-xs); letter-spacing:var(--letter-spacing-wide);
    color:var(--color-text-secondary); text-decoration:underline; text-underline-offset:4px; border-radius:var(--radius-sm);
  }
  .link:hover{ color:var(--color-text-primary); }
  .link-accent{ color:var(--color-accent-text); }
  .back-link{ text-decoration:none; text-transform:uppercase; }

  /* ---- badges: the status's own word, in its text colour, as a pill ---- */
  .badge{
    display:inline-flex; align-items:center; gap:var(--space-3); white-space:nowrap;
    font:var(--chip-font); letter-spacing:var(--letter-spacing-wide); text-transform:uppercase;
    padding:4px 10px; border-radius:var(--chip-radius); border:1px solid currentColor;
  }
  .badge-reviewing{ color:var(--color-status-warning-text); }
  .badge-changes{ color:var(--color-accent-text); }
  .badge-approved{ color:var(--color-status-success-text); }
  .badge-error{ color:var(--color-status-error-text); }
  .badge-stage{ color:var(--color-text-secondary); border-color:var(--color-border-subtle); }
  .badge-project{ color:var(--color-status-info-text); }
  .status-dot{ display:inline-block; width:.5em; height:.5em; border-radius:50%; background:currentColor; }

  /* ---- header ---- */
  .topbar{ position:sticky; top:0; z-index:20; background:var(--color-bg-page); border-bottom:1px solid var(--color-border-subtle); }
  .topbar .wrap{ padding-top:var(--space-6); padding-bottom:var(--space-6); align-items:flex-start; }
  .topbar .min-0{ flex:1 1 auto; }

  /* ---- deliverable cards ---- */
  .asset-grid{ display:grid; grid-template-columns:1fr; gap:var(--space-6); }
  .asset-card{ display:block; width:100%; padding:var(--space-7); text-align:left; transition:border-color var(--duration-fast) var(--easing-default); }
  .asset-card:hover{ border-color:var(--color-accent-confirm); }
  a.asset-card, a.project-card{ color:inherit; text-decoration:none; }
  .asset-card.is-waiting{ cursor:default; }
  .asset-card.is-waiting:hover{ border-color:var(--panel-border); }
  .project-card{ display:block; padding:var(--space-7); transition:border-color var(--duration-fast) var(--easing-default); }

  .project-card:focus-visible{ outline:none; box-shadow:var(--shadow-focus); }
  .lead{ font-size:var(--font-size-lg); line-height:var(--line-height-snug); max-width:var(--max-width-content); }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  a.tab{ text-decoration:none; }
  /* 16:9 preview at the top of each card. The placeholder sits under the media, so a
     still-loading or failed thumbnail degrades to the icon rather than a blank box. */
  .asset-thumb{
    position:relative; aspect-ratio:16/9; width:100%; overflow:hidden; margin-bottom:var(--space-6);
    border-radius:var(--radius-md); background:var(--color-bg-inset); border:1px solid var(--color-border-subtle);
  }
  .asset-thumb > img, .asset-thumb > video{ position:relative; z-index:1; width:100%; height:100%; object-fit:cover; }
  .asset-thumb .thumb-fallback{ position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; color:var(--color-text-tertiary); }
  .asset-thumb.is-strip{ display:flex; gap:2px; }
  .asset-thumb.is-strip > img{ flex:1 1 0; min-width:0; }
  .asset-card:hover .asset-thumb{ border-color:var(--color-accent-confirm); }

  /* ---- asset screen ---- */
  .tabs{ display:flex; gap:var(--space-4); border-bottom:1px solid var(--color-border-subtle); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; padding:var(--space-4) var(--space-6); margin-bottom:-1px;
    font-family:var(--font-family-mono); font-size:var(--font-size-sm); letter-spacing:var(--letter-spacing-wide);
    color:var(--color-text-secondary); border-bottom:2px solid transparent;
  }
  .tab:hover{ color:var(--color-text-primary); }
  .tab.is-active{ color:var(--color-text-primary); border-bottom-color:var(--color-accent-confirm); }
  .player{ aspect-ratio:16/9; width:100%; overflow:hidden; border-radius:var(--radius-lg); background:var(--color-bg-panel); margin-bottom:var(--space-4); }
  .player video{ width:100%; height:100%; }
  .timestamp-pill{
    display:inline-flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-4);
    padding:4px 10px; border-radius:var(--radius-full);
    background:var(--color-accent-primary); color:var(--color-text-on-accent);
    font-family:var(--font-family-mono); font-size:var(--font-size-xs); letter-spacing:var(--letter-spacing-wide);

  @keyframes pillIn{ from{opacity:0; transform:translateY(4px) scale(.9);} to{opacity:1; transform:none;} }
  .note-time{ color:var(--color-accent-text); margin-right:var(--space-4); display:inline-flex; align-items:center; gap:var(--space-2); vertical-align:middle; }
  .note-photo{ color:var(--color-status-success-text); margin-right:var(--space-4); }

  /* ---- photo contact sheet ---- */
  .photo-grid{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--space-4); }
  .photo-tile{
    position:relative; aspect-ratio:1/1; overflow:hidden; border-radius:var(--radius-md);
    background:var(--color-bg-panel); border:2px solid transparent; transition:border-color var(--duration-fast) var(--easing-default);
  }
  .photo-tile:hover{ border-color:var(--color-accent-confirm); }
  .photo-tile.has-notes{ border-color:var(--color-accent-mark); }
  .photo-tile img{ width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .photo-count{
    position:absolute; top:6px; right:6px; display:inline-flex; align-items:center; gap:var(--space-2);
    padding:2px 6px; border-radius:var(--radius-full); background:var(--color-accent-primary); color:var(--color-text-on-accent);
    font-family:var(--font-family-mono); font-size:var(--font-size-xs);
  }

  /* ---- photo lightbox ---- */
  /* Full-bleed review surface: one photo large enough to judge, with its own note

  .lb-scrim{ position:fixed; inset:0; z-index:50; background:var(--color-surface-overlay); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; flex-direction:column; }
  .lb-stage{ position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:var(--space-5); }
  .lb-stage img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:var(--radius-sm); }
  .lb-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:var(--touch-min); height:var(--touch-min); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--color-surface-overlay); border:1px solid var(--color-border-subtle); color:var(--color-text-primary);
    transition:border-color var(--duration-fast) var(--easing-default);
  }
  .lb-arrow:hover{ border-color:var(--color-accent-confirm); }
  .lb-arrow:focus-visible{ outline:none; box-shadow:var(--shadow-focus); }
  .lb-arrow[disabled]{ opacity:.25; cursor:not-allowed; }
  .lb-arrow-l{ left:var(--space-4); }
  .lb-arrow-r{ right:var(--space-4); }
  .lb-rail{
    flex:0 0 auto; max-height:45vh; overflow-y:auto; padding:var(--space-7);
    display:flex; flex-direction:column;
    border-top:1px solid var(--color-border-subtle); background:var(--color-bg-page);
  }
  /* Only the notes list gives way when the rail is short; the box and button keep their size. */
  .lb-rail > *{ flex-shrink:0; }
  .lb-rail > .lb-notes{ flex:1 1 auto; min-height:48px; overflow-y:auto; margin-bottom:var(--space-5); }
  .lb-notes > * + *{ margin-top:var(--space-4); }
  .note-card{ background:var(--color-bg-panel); border:1px solid var(--color-border-subtle); border-radius:var(--radius-md); padding:var(--space-5); font-size:var(--font-size-base); }
  .notes > * + *{ margin-top:var(--space-4); }

  /* ---- dialogs and toasts ---- */
  .modal-scrim{ position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:var(--space-7); background:var(--color-surface-overlay); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .modal{ width:100%; max-width:400px; padding:var(--space-7); background:var(--color-bg-float); border:1px solid var(--color-border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); }
  .toast{
    position:fixed; top:var(--space-6); left:50%; transform:translateX(-50%); z-index:60;
    padding:var(--space-4) var(--space-6); border-radius:var(--radius-md);
    background:var(--color-bg-float); border:1px solid var(--color-border-subtle); box-shadow:var(--shadow-md);
    font-family:var(--font-family-mono); font-size:var(--font-size-sm); animation:toastIn var(--duration-slow) var(--easing-out);
  }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%, -8px);} to{opacity:1; transform:translate(-50%, 0);} }

  /* ---- sign-in ---- */
  .shake{ animation:shakeAnim .4s ease; }
  @keyframes shakeAnim{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)}
  }
  .login-msg{ max-width:320px; color:var(--color-text-secondary); font-family:var(--font-family-mono); font-size:var(--font-size-xs); letter-spacing:var(--letter-spacing-wide); line-height:var(--line-height-normal); }
  .login-msg.is-error{ color:var(--color-status-error-text); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--color-bg-inset); border-radius:4px; }

  @media (min-width:768px){
    .asset-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .photo-grid{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
    .lb-scrim{ flex-direction:row; }
    .lb-stage{ padding:var(--space-8); }
    .lb-arrow-l{ left:var(--space-7); }
    .lb-arrow-r{ right:var(--space-7); }
    .lb-rail{ flex:0 0 340px; max-height:none; height:100%; border-top:none; border-left:1px solid var(--color-border-subtle); }
  }
  /* Desktop only: the "back to site" link pins to the top-left corner of the sign-in
     screen instead of stacking above the form. */
  @media (min-width:993px){
    .center-screen .back-link{ position:fixed; top:32px; left:32px; }
  }
  /* Phones: 16px fields (iOS zooms on anything smaller), 44px targets, tighter gutters. */
  @media (max-width:767px){
    /* A three-line header pinned to a phone's top would take a third of the screen. */
    .topbar{ position:static; }
    .wrap, .wrap-narrow{ padding:0 var(--space-6); }
    .section{ padding-top:var(--space-8); padding-bottom:var(--space-8); }
    .field{ font-size:var(--font-size-md); }
    .btn-icon{ width:var(--touch-min); height:var(--touch-min); }
    .tab{ min-height:var(--touch-min); }
    .link{ display:inline-block; padding:var(--space-4) 0; }
  }
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }
</style>

<div id="app"></div>

<script>
/* =========================================================
   CLIENT PORTAL (merged-admin C2)
   The client signs in with their email and Client code; the server holds the
   session (an HttpOnly cookie on hub-api), so this page never holds a token,
   and it keeps no projects of its own: everything comes from /hub/*.
   ========================================================= */

const HUB = {
  // The API. A copy served on this Mac talks to the local server on the same host
  // name, so its session cookie and the review links share one site.
  edgeBase: /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? `http://${location.hostname}:8090` : 'https://hub-api.lsccreative.studio',
  mainSiteUrl: '../index.html',
};

const nowStr = () => new Date().toLocaleString('en-AU', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const isHlsUrl = (v) => /\.m3u8(?:[?#]|$)/i.test(v || '');
const CODE_FORMAT = /^(?:\d{4}|\d{6})$/;

/* ---------------- the API ----------------
   Every call sends the session cookie (`credentials:'include'`): hub-api and this
   page are the same site, so the browser keeps it. A failure throws with the
   reply's status and error word, which the callers branch on. */
async function api(path, opts = {}){
  const init = { method: opts.method || 'GET', credentials: 'include', headers: {} };
  if(opts.body !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  let res;
  try { res = await fetch(HUB.edgeBase + path, init); }
  catch(_){ const e = new Error('offline'); e.status = 0; throw e; }
  let data = null;
  try { data = await res.json(); } catch(_){ /* not JSON */ }
  if(!res.ok){
    const e = new Error(path + ' → ' + res.status);
    e.status = res.status; e.code = data && data.error;
    throw e;
  }
  return data;
}

/* The project as this page uses it, from the server's allow-listed view. `items`
   is the whole checklist with where each stands; `assets` are the ones with a
   published version to review, each on its newest. Notes and approvals made here
   live in this page only until C4 and C5 give them a home on the server. */
const ITEM_STATUS = { approved:'approved', changes:'changes', review:'reviewing' };
function portalProject(view){
  return {
    id: view.id, upid: view.upid || '', name: view.name || '', status: view.status || '', past: !!view.past,
    nextStep: view.nextStep || '', needsYou: !!view.needsYou,
    invoices: Array.isArray(view.invoices) ? view.invoices : [],
    agreement: view.agreement || null,
    items: (view.deliverables || []).map(d => ({ id: d.id, title: d.title || '', status: d.status })),
    assets: (view.deliverables || []).filter(d => d.versions && d.versions.length).map(d => {
      const v = d.versions[d.versions.length - 1];
      const review = v.review || null;
      const photo = v.kind === 'photos';
      return {
        id: d.id, title: d.title || '', stage: v.stage, n: v.n,
        type: photo ? 'photo' : 'video',
        reviewLink: (!photo && review && review.url) || '',
        photos: (photo && review && Array.isArray(review.urls))
          ? review.urls.map((url, i) => ({ name: 'Photo ' + (i + 1), reviewLink: url }))
          : [],
        comments: [],
        status: ITEM_STATUS[d.status] || 'reviewing',
      };
    }),
  };
}

/* ---------------- addresses ----------------
   #/                         the dashboard
   #/p/<id>                   a project
   #/p/<id>/d/<item>          a deliverable's review
   #/p/<id>/d/<item>/<n>      photo n (from 1) open in the lightbox
   #/invite/<token>           an invite (boot reads it and takes it out of the bar)
   Ids, never UPIDs (IA URL Strategy). The photo is replaced in place as the client
   arrows through, so Back leaves the deliverable rather than walking the photos. */
function parseRoute(hash){
  const h = String(hash || '').replace(/^#/, '');
  let m;
  if(/^\/invite\//.test(h)) return { name:'invite' };
  if((m = /^\/p\/([^/]+)\/d\/([^/]+)(?:\/(\d{1,4}))?\/?$/.exec(h))) {
    return { name:'review', projectId: decodeURIComponent(m[1]), itemId: decodeURIComponent(m[2]), photo: m[3] ? Number(m[3]) : null };
  }
  if((m = /^\/p\/([^/]+)\/?$/.exec(h))) return { name:'project', projectId: decodeURIComponent(m[1]) };
  return { name:'dashboard' };
}
const projectHash = (id) => '#/p/' + encodeURIComponent(id);
const reviewHash = (id, itemId) => projectHash(id) + '/d/' + encodeURIComponent(itemId);
function go(hash){
  if(location.hash === hash) route(); else location.hash = hash;
}

const fmtDate = (iso) => {
  const d = /^\d{4}-\d{2}-\d{2}/.test(iso || '') ? new Date(iso.slice(0, 10) + 'T00:00:00Z') : null;
  return d && !isNaN(d) ? d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' }) : '';
};
const fmtMoney = (n) => Number(n || 0).toLocaleString('en-AU', { style:'currency', currency:'AUD' });

let state = {
  phase: 'loading',        // loading | signin | offline | notfound | dashboard | project
  busy: false,             // offline because of too many requests, not no answer
  client: null,            // { businessName, contactName } of whoever is signed in
  email: '',
  code: '',
  loginError: false,       // shake/red state on the code field
  loginMsg: null,          // { text, error } under the form
  loginBusy: false,
  invite: null,            // { email, projectId } from an invite link
  inviteGone: false,       // the invite link no longer works
  projects: [],            // the dashboard's cards (GET /hub/projects)
  showPast: false,         // Past projects expanded on the dashboard
  cache: {},               // project id → portalProject(), for this page's life (keeps notes made here)
  project: null,           // the one on screen
  clientScreen: 'landing', // landing | asset
  activeAssetId: null,
  revisionOpen: false,
  revisionDraft: '',
  pausedAt: null,
  videoFailed: false,      // the <video> failed: shows the fallback card
  lightboxIdx: null,       // index into asset.photos of the open lightbox photo; null = closed

  // carry a half-typed note from one photo onto the next as the client arrows through.
  photoDrafts: {},

function setState(patch){ Object.assign(state, patch); render(); }

/* ---------------- the way in ----------------
   An invite is `#/invite/<token>` (C1), or the old hub's `?invite=<token>`. The
   token is read once and taken out of the address bar. A signed-in browser goes
   straight to its projects, unless a working invite says the sign-in is someone
   else's: on a shared computer, the invited client must never land in the work
   of whoever signed in there before. */
async function boot(){
  const params = new URLSearchParams(location.search);
  const fromHash = /^#\/invite\/([^/?#]+)/.exec(location.hash);
  const token = fromHash ? decodeURIComponent(fromHash[1]) : params.get('invite');
  if(token) history.replaceState(null, '', location.pathname);

  let invite = null;
  if(token){
    try {
      const r = await api('/hub/invite', { method:'POST', body:{ token } });
      invite = { email: r.email, projectId: r.projectId };
    } catch(e){
      if(e.status === 404) state.inviteGone = true;
    }
  }

  let session = null;
  try {
    session = await api('/hub/session');
  } catch(e){
    if(e.status !== 401) return offline(e);
  }

  if(session && invite){
    // The invite's own project among this session's: the same client, so carry on there.
    let mine = false;
    if(invite.projectId){
      try { mine = (await api('/hub/projects')).projects.some(p => p.id === invite.projectId); } catch(_){ mine = false; }
    }
    if(mine){ state.client = session.client; return go(projectHash(invite.projectId)); }
    // Someone else's sign-in: it ends here, and the invited client signs in as themselves.
    try { await api('/hub/sign-out', { method:'POST', body:{} }); } catch(_){ /* their own sign-in replaces the cookie */ }
    session = null;
  }
  if(session){ state.client = session.client; return route(); }
  if(invite){ state.invite = invite; state.email = invite.email || ''; state.inviteGone = false; }
  // Clears anything an earlier sign-in left in this page (an invite opened in the same tab).
  signedOut(null);
}

/* A read that didn't come back: too many requests just now, or no answer at all. */
function offline(e){
  setState({ phase:'offline', busy: !!(e && e.status === 429) });
}

/* Show whatever the address asks for. Signed out, the sign-in screen stays and the
   address is kept, so signing in lands on the page that was asked for. */
const REVIEW_RESET = { revisionOpen:false, revisionDraft:'', pausedAt:null, videoFailed:false, approveModalAssetId:null };
let routing = 0;
async function route(){
  const r = parseRoute(location.hash);
  if(r.name === 'invite'){ setState({ phase:'loading' }); return boot(); }
  if(!state.client) return;
  const ticket = ++routing; // a later navigation wins over a slower earlier one
  if(r.name === 'dashboard') return showDashboard(ticket);

  const project = await loadProject(r.projectId, ticket);
  if(!project || ticket !== routing) return;
  if(r.name === 'project'){
    const fresh = state.phase !== 'project' || state.clientScreen !== 'landing' || state.project !== project;
    setState({ phase:'project', project, clientScreen:'landing', activeAssetId:null, lightboxIdx:null, ...REVIEW_RESET });
    if(fresh) window.scrollTo(0, 0);
    return;
  }
  const a = project.assets.find(x => x.id === r.itemId);
  if(!a) return setState({ phase:'notfound' });
  const idx = r.photo != null && a.type === 'photo' && a.photos[r.photo - 1] ? r.photo - 1 : null;
  // A photo number this deliverable doesn't have: open it without one, and say so in the address.
  if(r.photo != null && idx == null) history.replaceState(null, '', reviewHash(project.id, a.id));
  const same = state.phase === 'project' && state.clientScreen === 'asset' && state.project === project && state.activeAssetId === a.id;
  if(same){
    // Only the photo changed (Back, or a pasted link): the lightbox repaints on its own.
    if(idx !== state.lightboxIdx) (idx == null ? closeLightbox() : openLightbox(idx));
    return;
  }
  setState({ phase:'project', project, clientScreen:'asset', activeAssetId:a.id, lightboxIdx:idx, ...REVIEW_RESET });
  window.scrollTo(0, 0);
}

async function showDashboard(ticket){
  if(state.phase !== 'dashboard') setState({ phase:'loading' });
  try {
    const { projects } = await api('/hub/projects');
    if(ticket !== routing) return;
    setState({ phase:'dashboard', projects, project:null });
  } catch(e){
    if(ticket === routing) failedRead(e);
  }
}

/* A project's page model. Coming to a project (from the dashboard, a link, or back to it
   after a while) reads it fresh, so it never disagrees with the dashboard; moving within
   the project on screen keeps the copy in hand. Notes and approvals made in this page are
   carried onto the fresh copy for the same version (until C4 saves them). Not found
   (gone, or another client's: the same answer) shows the not-found screen. */
const PROJECT_FRESH_MS = 60 * 1000;
async function loadProject(id, ticket){
  const held = state.cache[id];
  if(held && state.project === held && Date.now() - held.loadedAt < PROJECT_FRESH_MS) return held;
  if(!held || state.project !== held) setState({ phase:'loading' });
  try {
    const { project } = await api('/hub/projects/' + encodeURIComponent(id));
    const fresh = carryOver(held, portalProject(project));
    state.cache[id] = fresh;
    return fresh;
  } catch(e){
    if(ticket !== routing) return null;
    if(e.status === 404){ delete state.cache[id]; setState({ phase:'notfound' }); return null; }
    if(e.status !== 401 && held) return held; // no answer: what was last read beats a dead end
    failedRead(e);
    return null;
  }
}

/* What the client did in this page, onto a fresh copy: for each deliverable still on the
   same version, its notes and the status they gave it. A new version starts clean. */
function carryOver(old, fresh){
  fresh.loadedAt = Date.now();
  if(!old) return fresh;
  fresh.assets.forEach(a => {
    const was = old.assets.find(x => x.id === a.id && x.n === a.n);
    if(was && (was.comments.length || was.status !== a.status)){
      a.comments = was.comments;
      if(was.status !== 'reviewing') a.status = was.status;
    }
  });
  return fresh;
}

function failedRead(e){
  if(e && e.status === 401) return signedOut('You’ve been signed out. Sign in again to carry on.');
  offline(e);
}

function signedOut(text){
  setState({
    phase:'signin', client:null, project:null, projects:[], cache:{}, showPast:false, clientScreen:'landing', activeAssetId:null,
    code:'', loginBusy:false, loginError:false, loginMsg: text ? { text, error:false } : null,
    revisionOpen:false, revisionDraft:'', pausedAt:null, lightboxIdx:null, photoDrafts:{}, approveModalAssetId:null,
  });
}

async function signOut(){
  try {
    await api('/hub/sign-out', { method:'POST', body:{} });
  } catch(_){
    // Still signed in on the server: saying otherwise would leave the next person on this
    // browser in their account.
    toast('Couldn’t sign you out. Check your connection and try again.');
    return;
  }
  state.email = '';
  state.invite = null;
  history.replaceState(null, '', location.pathname); // the next person starts at sign-in, not at this client's page
  signedOut(null);
}

/* ================= SIGN IN ================= */
function renderSignIn(){
  const welcome = !!state.invite;
  const msg = state.loginMsg
    || (state.inviteGone ? { text:'That invitation link no longer works. Sign in with your email and Client code, or ask the studio for a new invitation.', error:false } : null);
  return `
  <main class="center-screen">

    <h1 class="display title-2xl mb-2">${welcome ? 'Welcome' : 'Client Portal'}</h1>
    <p class="muted text-sm mb-8" style="max-width:320px">${welcome
      ? 'Enter the Client code from your invitation email to see your work.'
      : 'Sign in with your email and the Client code the studio sent you.'}</p>

    <form id="signin-form" class="w-form" novalidate>
      <label for="client-login-email" class="eyebrow" style="display:block;margin-bottom:var(--space-3)">Email</label>
      <input id="client-login-email" class="field mb-6" type="email" autocomplete="email" inputmode="email" value="${escapeAttr(state.email)}" ${state.loginBusy ? 'disabled' : ''}>
      <label for="client-code-input" class="eyebrow" style="display:block;margin-bottom:var(--space-3)">Client code</label>
      <input id="client-code-input" class="field field-code mb-6 ${state.loginError ? 'invalid' : ''}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" value="${escapeAttr(state.code)}" ${state.loginBusy ? 'disabled' : ''}>
      <button id="signin-btn" type="submit" class="btn btn-primary btn-block btn-lg" ${state.loginBusy ? 'disabled' : ''}>${state.loginBusy ? 'Checking…' : 'Sign in'}</button>
    </form>

    <p id="login-msg" class="login-msg mt-6 ${msg && msg.error ? 'is-error' : ''}" role="status" ${msg ? '' : 'hidden'}>${msg ? escapeHtml(msg.text) : ''}</p>
    <button id="client-forgot" type="button" class="link link-accent mt-8">Forgot your code?</button>
  </main>`;
}

// `field`: the one the message is about, which gets the focus ('email' or 'code').
function failLogin(text, shake, field = 'email'){
  state.loginBusy = false;
  state.loginMsg = { text, error:true };
  state.loginError = shake;
  render();
  const el = document.getElementById(shake || field === 'code' ? 'client-code-input' : 'client-login-email');
  if(shake && el){
    el.classList.add('shake');
    setTimeout(() => {
      state.loginError = false; state.code = '';
      render();
      const again = document.getElementById('client-code-input'); if(again) again.focus();
    }, 500);
  } else if(el){ el.focus(); }
}

async function submitSignIn(){
  if(state.loginBusy) return;
  const email = state.email.trim();
  const code = state.code;
  if(!/.+@.+\..+/.test(email)) return failLogin('Enter your email address.', false);
  if(!CODE_FORMAT.test(code)) return failLogin('Enter the Client code from your invitation.', false, 'code');
  setState({ loginBusy:true, loginMsg:null });
  try {
    const r = await api('/hub/auth', { method:'POST', body:{ email, code } });
    state.client = r.client;
    state.loginBusy = false; state.code = ''; state.loginMsg = null; state.inviteGone = false;
    const landing = state.invite && state.invite.projectId;
    state.invite = null;
    if(landing && parseRoute(location.hash).name === 'dashboard') return go(projectHash(landing));
    return route();
  } catch(e){
    if(e.status === 401) return failLogin('That email and code didn’t match. Check your invitation and try again.', true);
    // Two limits: wrong codes for this email (15 minutes), and requests from this connection (a few).
    if(e.status === 429 && e.code === 'too_many_attempts') return failLogin('Too many wrong codes for this email. Wait 15 minutes, then try again.', false, 'code');
    if(e.status === 429) return failLogin('Too many tries from this connection. Wait a few minutes, then try again.', false, 'code');
    if(e.status === 400) return failLogin('Enter your email and the Client code from your invitation.', false);
    return failLogin('Can’t reach the studio’s server. Check your connection and try again.', false);
  }
}

function bindSignIn(){
  const form = document.getElementById('signin-form');
  const emailEl = document.getElementById('client-login-email');
  const codeEl = document.getElementById('client-code-input');
  if(emailEl) emailEl.addEventListener('input', () => { state.email = emailEl.value; });
  if(codeEl){
    codeEl.addEventListener('input', () => {
      state.code = codeEl.value.replace(/\D/g, '').slice(0, 6);
      codeEl.value = state.code; // reflect the stripped value without a render()
      if(state.code.length === 6) submitSignIn();
    });
  }
  if(form) form.onsubmit = (e) => { e.preventDefault(); submitSignIn(); };
  const forgot = document.getElementById('client-forgot');
  if(forgot) forgot.onclick = () => {
    state.loginMsg = { text:'Ask the studio for a new invitation. It brings a new Client code, and your old one stops working.', error:false };
    const el = document.getElementById('login-msg');
    if(el){ el.textContent = state.loginMsg.text; el.classList.remove('is-error'); el.hidden = false; }
  };
  if(!state.loginBusy){
    const first = (state.invite || state.email) ? codeEl : emailEl;
    if(first && document.activeElement === document.body) first.focus();
  }
}

function renderProjectCard(p){
  return `
    <a href="${projectHash(p.id)}" class="card project-card">
      ${p.upid ? `<div class="meta mb-2">${escapeHtml(p.upid)}</div>` : ''}
      <div class="display title-lg mb-3">${escapeHtml(p.name || 'Untitled project')}</div>
      ${p.status ? `<span class="badge ${p.needsYou ? 'badge-reviewing' : 'badge-project'}">${p.needsYou ? '<span class="status-dot"></span>' : ''}${escapeHtml(p.status)}</span>` : ''}
      ${p.nextStep ? `<p class="muted text-sm mt-3">${escapeHtml(p.nextStep)}</p>` : ''}
    </a>`;
}

function renderDashboard(){
  const list = state.projects || [];
  const current = list.filter(p => !p.past);
  const needs = current.filter(p => p.needsYou);
  const others = current.filter(p => !p.needsYou);
  const past = list.filter(p => p.past);
  const name = state.client && (state.client.contactName || state.client.businessName);
  const group = (title, items) => items.length ? `
      <section class="mb-8" aria-labelledby="g-${title.replace(/\W+/g, '')}">
        <h2 id="g-${title.replace(/\W+/g, '')}" class="eyebrow mb-4">${title}</h2>
        <div class="asset-grid">${items.map(renderProjectCard).join('')}</div>
      </section>` : '';

  const body = !list.length ? `
      <div class="card pad" style="text-align:center">
        <h2 class="display title-lg mb-2">Nothing here yet</h2>
        <p class="muted text-sm">The studio will email you when there’s something to review.</p>
      </div>` : `
      ${group('Needs you', needs)}
      ${group(needs.length ? 'Other projects' : 'Your projects', others)}
      ${!current.length ? `<p class="muted mb-8">No current projects. Your finished work is under Past projects.</p>` : ''}
      ${past.length ? `
      <section>
        <button id="toggle-past" class="btn btn-quiet" aria-expanded="${state.showPast}" aria-controls="past-list">
          Past projects (${past.length}) <span aria-hidden="true">${state.showPast ? '▴' : '▾'}</span>
        </button>
        <div id="past-list" class="asset-grid mt-4" ${state.showPast ? '' : 'hidden'}>${past.map(renderProjectCard).join('')}</div>
      </section>` : ''}`;

  return `
  <div>
    <header class="topbar">
      <div class="wrap spread">
        <div class="min-0">
          <div class="meta mb-2">CLIENT PORTAL</div>
          <div class="display title-lg">${escapeHtml((state.client && state.client.businessName) || 'Your projects')}</div>
        </div>
        <button id="client-logout" class="btn btn-quiet" style="flex:0 0 auto">Sign out</button>
      </div>
    </header>
    <main class="wrap section">
      ${name ? `<p class="muted mb-8">Hi ${escapeHtml(name.split(' ')[0])}, here’s your work with LSC Creative.</p>` : ''}
      ${body}
    </main>
  </div>`;
}

function bindDashboard(){
  bindClientChrome();
  const toggle = document.getElementById('toggle-past');
  if(toggle) toggle.onclick = () => {
    setState({ showPast: !state.showPast });
    const again = document.getElementById('toggle-past'); if(again) again.focus();
  };
}

/* The project page (IA "Portal project"): status and next step, deliverables with
   where each stands, the invoices actually sent, and the signed agreement. The
   payment block joins the top with payment (F tasks). */
function renderClientLanding(){
  const p = getViewProject();
  const allApproved = p.assets.length > 0 && p.assets.every(a => a.status === 'approved');
  const byId = Object.fromEntries(p.assets.map(a => [a.id, a]));
  const cards = p.items.map(item => {
    const a = byId[item.id];
    if(!a){
      // Nothing published yet: shown so the client sees the whole list, but nothing to open.
      return `
    <div class="card asset-card is-waiting">
      <div class="asset-thumb"><span class="thumb-fallback">${icon('clock', 30)}</span></div>
      <div class="display title-lg mb-3">${escapeHtml(item.title || 'Deliverable')}</div>
      <span class="badge badge-stage">${item.status === 'approved' ? 'Approved' : 'We’re working on it'}</span>
    </div>`;
    }
    return `
    <a href="${reviewHash(p.id, a.id)}" class="card asset-card">
      ${renderAssetThumb(a)}
      <div class="display title-lg mb-3">${escapeHtml(a.title || (a.type === 'video' ? 'Video' : 'Photos'))}</div>
      <div class="row" style="gap:var(--space-4)">
        <span class="badge ${statusMeta[a.status].cls}"><span class="status-dot"></span>${statusMeta[a.status].label}</span>
        <span class="badge badge-stage">${stageLabel(a.stage)} · v${a.n}</span>
      </div>
    </a>`;
  }).join('');

  const invoices = p.invoices.length ? `
      <section class="mt-8" aria-labelledby="h-invoices">
        <h2 id="h-invoices" class="eyebrow mb-4">Invoices</h2>
        <div class="notes">${p.invoices.map(renderInvoiceRow).join('')}</div>
      </section>` : '';
  const agreement = p.agreement ? `
      <section class="mt-8" aria-labelledby="h-agreement">
        <h2 id="h-agreement" class="eyebrow mb-4">Agreement</h2>
        <div class="card pad-sm spread" style="flex-wrap:wrap">
          <div class="min-0">
            <div class="text-sm">Your signed service agreement</div>
            ${p.agreement.signedOn ? `<div class="meta mt-2">SIGNED ${escapeHtml(fmtDate(p.agreement.signedOn).toUpperCase())}</div>` : ''}
          </div>
          <a href="${escapeAttr(p.agreement.url)}" target="_blank" rel="noopener" class="btn">View the quote and agreement<span class="visually-hidden"> (opens in a new tab)</span></a>
        </div>
      </section>` : '';

  return renderClientChrome(`
    <main class="wrap section">
      ${p.nextStep ? `<p class="lead mb-8">${escapeHtml(p.nextStep)}</p>` : ''}
      ${allApproved ? `
        <div class="card pad-sm notice mb-8" role="status">
          <span style="color:var(--color-status-success-text);flex:0 0 auto">${icon('check', 18)}</span>
          <span class="text-sm">You’ve approved everything here. The studio will be in touch about your files.</span>
        </div>` : ''}
      <section aria-labelledby="h-deliverables">
        <h2 id="h-deliverables" class="eyebrow mb-4">Deliverables</h2>
        ${cards
          ? `<div class="asset-grid">${cards}</div>`
          : `<div class="card pad" style="text-align:center"><p class="muted text-sm">${p.past || p.status === 'Complete'
              ? 'There were no deliverables to review on this project.'
              : 'Nothing to review yet. The studio will email you when there is.'}</p></div>`}
      </section>
      ${invoices}
      ${agreement}
    </main>
  `);
}

/* One sent invoice: what it is, what it asks for, where it stands, and its page when
   it has one of billing's (one in Hnry arrived from Hnry instead). */
function renderInvoiceRow(inv){
  const state_ = inv.state === 'paid'
    ? `<span class="badge badge-approved">Paid${inv.paidOn ? ' ' + escapeHtml(fmtDate(inv.paidOn)) : ''}</span>`
    : inv.state === 'overdue'
      ? `<span class="badge badge-error">Overdue</span>`
      : `<span class="badge badge-reviewing">Due${inv.dueOn ? ' ' + escapeHtml(fmtDate(inv.dueOn)) : ''}</span>`;
  return `
    <div class="card pad-sm spread" style="flex-wrap:wrap">
      <div class="min-0">
        <div class="text-sm">${escapeHtml(inv.label)}${inv.number ? ` <span class="meta">${escapeHtml(inv.number)}</span>` : ''}</div>
        ${inv.issuedOn ? `<div class="meta mt-2">ISSUED ${escapeHtml(fmtDate(inv.issuedOn).toUpperCase())}</div>` : ''}
      </div>
      <div class="row" style="gap:var(--space-5)">
        <span class="mono">${escapeHtml(fmtMoney(inv.amount))}</span>
        ${state_}
        ${inv.url ? `<a href="${escapeAttr(inv.url)}" target="_blank" rel="noopener" class="link">View<span class="visually-hidden"> invoice ${escapeHtml(inv.number)} (opens in a new tab)</span></a>` : ''}
      </div>

}

// Media preview for a deliverable card.
//   video: the review copy with #t=1, which makes the browser fetch just enough via
//          Range to paint the frame at 1s as a still. muted + preload="metadata" keeps
//          it cheap; it never plays here.
//   photo: up to the first three images as a filmstrip.
// The icon sits underneath, so a broken or slow thumbnail shows the icon rather than an
// empty box. Decorative: the card's own label carries the meaning.
function renderAssetThumb(a){
  const fallback = `<span class="thumb-fallback">${icon(a.type === 'video' ? 'video' : 'photo', 34)}</span>`;
  if(a.type === 'photo'){
    const shots = (a.photos || []).slice(0, 3);
    if(!shots.length) return `<div class="asset-thumb">${fallback}</div>`;
    return `
      <div class="asset-thumb is-strip" aria-hidden="true">
        ${fallback}
        ${shots.map(ph => `<img src="${escapeAttr(ph.reviewLink)}" alt="" loading="lazy" onerror="this.remove()">`).join('')}
      </div>`;
  }
  // HLS gets the icon: a <video> thumb can't play it without hls.js, and where it can
  // (native HLS) it would pull a playlist and segments per card.
  if(!a.reviewLink || isHlsUrl(a.reviewLink)) return `<div class="asset-thumb">${fallback}</div>`;
  return `
    <div class="asset-thumb" aria-hidden="true">
      ${fallback}
      <video src="${escapeAttr(a.reviewLink)}#t=1" preload="metadata" muted playsinline
             disablePictureInPicture oncontextmenu="return false"
             onerror="this.remove()"></video>
    </div>`;
}

function renderClientAsset(){

        <p class="text-sm mb-6">You’re approving the ${stageLabel(a.stage).toLowerCase()} as it is. You won’t be able to add notes to it after this.</p>

// The buttons, revision form and notes, split out of renderClientAsset so a revision
// click repaints JUST this container (refreshAssetInteraction) instead of the screen.
// render() rebuilds the page, which replaces the <video> and restarts it from 0, so the
// player and #pause-pill live OUTSIDE this container and a revision click never touches them.
function renderAssetInteraction(a){
  if(a.status === 'approved'){
    return `
    <div class="card pad-sm mt-6" style="text-align:center">
      <span class="badge badge-approved">${icon('check', 13)}Approved</span>
    </div>`;
  }

  const commentLog = a.comments.length ? `
    <div class="mt-6">
      <div class="eyebrow mb-3">Your notes</div>
      <div class="notes">
        ${a.comments.map(c => `
          <div class="note-card">
            ${c.timestamp ? `<span class="mono note-time" style="font-size:var(--font-size-xs)">${icon('clock', 12)}${escapeHtml(c.timestamp)}</span>` : ''}
            ${c.photoKey ? `<span class="mono note-photo" style="font-size:var(--font-size-xs)">${escapeHtml(c.photoName || 'Photo')}</span>` : ''}
            <span>${escapeHtml(c.text)}</span>
            <div class="meta mt-2">${escapeHtml(c.at)}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  // Photo libraries have NO asset-level revision panel: notes are per photo, in the
  // lightbox, so the only decision left at this level is approval.
  if(a.type === 'photo'){
    return `
      <div class="mt-6">
        <button id="approve-asset" class="btn btn-confirm btn-lg">Approve content</button>
      </div>
      ${commentLog}
    `;
  }

  // While the revision panel is open the approve button is absent from the page
  // entirely, not just disabled: a client asking for changes isn't approving.
  return `
    <div class="mt-6 row">
      <button id="want-revisions" class="btn">${state.revisionOpen ? 'Revision form open' : 'Comment revisions'}</button>
      ${state.revisionOpen ? '' : `<button id="approve-asset" class="btn btn-confirm btn-lg">Approve content</button>`}
    </div>
    ${state.revisionOpen ? renderRevisionForm(a) : ''}
    ${commentLog}
  `;
}

// Repaint only #asset-interaction and rebind its buttons. Leaves the <video> alone.
function refreshAssetInteraction(){
  const host = document.getElementById('asset-interaction');
  if(!host) return;
  const a = activeAsset();
  if(!a) return;
  host.innerHTML = renderAssetInteraction(a);

function renderVideoCanvas(a){
  // No review copy at all goes straight to the fallback card.
  if(state.videoFailed || !a.reviewLink){
    return `
    <div class="card pad mb-2" style="text-align:center">
      <p class="muted text-sm mb-6">This video couldn’t be loaded. Try again, or let the studio know.</p>
      ${a.reviewLink ? `<button id="video-retry" class="btn">Try again</button>` : ''}
    </div>`;
  }
  return `
    <div class="player">
      <video id="asset-video" controls controlsList="nodownload" disablePictureInPicture oncontextmenu="return false" preload="metadata" data-src="${escapeAttr(a.reviewLink)}"></video>
    </div>
    <div id="pause-pill" class="timestamp-pill" ${state.pausedAt ? '' : 'style="display:none"'}>${icon('clock', 12)}<span id="pause-pill-time">${escapeHtml(state.pausedAt || '')}</span></div>
  `;
}

// The ONE live hls.js instance and the <video> it (or a native/plain src) is attached to.
// render() calls detachReviewSource() before it rebuilds the page, so leaving or
// re-rendering the asset screen never leaks an instance or a stale error handler.
let reviewHls = null;
let reviewVideo = null;

function detachReviewSource(){
  if(reviewVideo){
    // The old element is about to be thrown away: its late error/pause events must not
    // reach state (a stale onerror would flip videoFailed on the NEXT asset).
    reviewVideo.onerror = null; reviewVideo.onplay = null; reviewVideo.onpause = null;
    reviewVideo = null;
  }
  if(reviewHls){ reviewHls.destroy(); reviewHls = null; }
}

// hls.js for Bunny Stream review links (light build), pinned to an exact version with
// SRI. Loaded on demand, only when a non-Apple browser opens an HLS asset. A failed load
// resolves anyway (window.Hls stays undefined → plain src) and is retried next time.
const HLS_JS = {
  src: 'https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.light.min.js',
  integrity: 'sha384-y8wQxRLtNclrHbMBLBLTEkgUrdFu6uWzZiobE1wBE09nt2wHIZlBPvPepdZU4+MM',
};
let hlsJsLoading = null;
function loadHlsJs(){
  if(window.Hls) return Promise.resolve();
  if(!hlsJsLoading){
    hlsJsLoading = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = HLS_JS.src; s.integrity = HLS_JS.integrity; s.crossOrigin = 'anonymous';
      s.onload = () => resolve();
      s.onerror = () => { s.remove(); hlsJsLoading = null; resolve(); };
      document.head.appendChild(s);
    });
  }
  return hlsJsLoading;
}

// Attach a review link to the existing <video>. Only the byte source changes: every pause,
// timestamp and revision behaviour stays on the element's own events and currentTime.
//  - .m3u8 on Apple WebKit (Safari, every iOS browser) → native HLS via src
//  - .m3u8 elsewhere → hls.js (MSE), native src only if hls.js is unavailable
//  - anything else (the NAS review copy, mp4, webm) → plain src
// This function owns video.onerror. Callers must not set it themselves.
function attachReviewSource(video, url, onFail){
  // Re-attaching to the SAME element only swaps the hls instance; a full detach would
  // also strip the element's onplay/onpause pill handlers.
  if(reviewVideo !== video) detachReviewSource();
  else if(reviewHls){ reviewHls.destroy(); reviewHls = null; }
  reviewVideo = video;
  video.onerror = onFail;
  if(!url) return;
  const native = !!video.canPlayType('application/vnd.apple.mpegurl');
  const appleWebKit = navigator.vendor === 'Apple Computer, Inc.';
  if(!isHlsUrl(url) || (native && appleWebKit)){ video.src = url; return; }
  loadHlsJs().then(() => {
    if(reviewVideo !== video) return; // asset left or re-rendered while hls.js loaded
    if(!(window.Hls && Hls.isSupported())){ video.src = url; return; }
    attachHls(video, url, onFail);
  });
}

function attachHls(video, url, onFail){
  // Buffer about one segment until the client presses play: enough for the first frame
  // and the duration, without pulling footage for every asset opened. Both caps are
  // needed: maxBufferLength is only a floor. On first play the defaults come back.
  const preview = video.paused ? { maxBufferLength: 2, maxMaxBufferLength: 2 } : {};
  const hls = new Hls({ capLevelToPlayerSize: true, ...preview });
  video.addEventListener('play', () => {
    if(hls !== reviewHls) return;
    hls.config.maxBufferLength = Hls.DefaultConfig.maxBufferLength;
    hls.config.maxMaxBufferLength = Hls.DefaultConfig.maxMaxBufferLength;
  }, { once: true });
  let recoveryUsed = false;
  let manifestParsed = false;
  // One recovery attempt, then the fallback card. Before the manifest has parsed there's
  // nothing to recover, and hls.js has already done its own retries.
  const fatal = (type) => {
    if(hls !== reviewHls) return;
    if(manifestParsed && !recoveryUsed && type === Hls.ErrorTypes.MEDIA_ERROR){ recoveryUsed = true; hls.recoverMediaError(); return; }
    if(manifestParsed && !recoveryUsed && type === Hls.ErrorTypes.NETWORK_ERROR){ recoveryUsed = true; hls.startLoad(); return; }
    detachReviewSource();
    onFail();
  };
  hls.on(Hls.Events.MANIFEST_PARSED, () => { manifestParsed = true; });
  hls.on(Hls.Events.ERROR, (_evt, data) => { if(data.fatal) fatal(data.type); });
  // hls.js doesn't watch the element's own 'error' (a decode failure under MSE), so
  // route it through the same single recovery.
  video.onerror = () => fatal(Hls.ErrorTypes.MEDIA_ERROR);
  reviewHls = hls;
  hls.loadSource(url);
  hls.attachMedia(video);
}

// Stable key for a photo's draft and notes, so a draft can't reattach to another image.
function photoDraftKey(a, i){
  const ph = (a.photos || [])[i];
  return (ph && ph.reviewLink) ? `${a.id}::${ph.reviewLink}` : `${a.id}::idx${i}`;
}
function commentsForPhoto(a, i){
  const ph = (a.photos || [])[i];
  return ph ? (a.comments || []).filter(c => c.photoKey === ph.reviewLink) : [];
}

// Contact sheet. A frame opens the lightbox, which is where photo notes are written.
function renderPhotoCanvas(a){
  const photos = a.photos || [];
  if(!photos.length){
    return `
    <div class="card pad mb-4" style="text-align:center">
      <div class="mb-3" style="display:flex;justify-content:center;color:var(--color-text-tertiary)">${icon('photo', 34)}</div>
      <p class="muted text-sm">These photos couldn’t be loaded. Please let the studio know.</p>
    </div>`;
  }
  const grid = photos.map((ph, i) => {
    const n = commentsForPhoto(a, i).length;
    return `
    <button data-photo="${i}" title="${escapeAttr(ph.name)}" class="photo-tile ${n ? 'has-notes' : ''}">
      <img src="${escapeAttr(ph.reviewLink)}" alt="${escapeAttr(ph.name)}" loading="lazy" oncontextmenu="return false">
      ${n ? `<span class="photo-count">${icon('comment', 11)}${n}</span>` : ''}
    </button>`;
  }).join('');
  return `
    <div class="photo-grid mb-3">${grid}</div>
    <p class="meta mb-4">TAP A PHOTO TO VIEW IT LARGER AND LEAVE NOTES</p>
  `;
}

// Full-screen single-photo review: the image large, its OWN notes beside it, and arrows
// to walk the library. Everything is scoped to state.lightboxIdx: moving to a photo the
// client hasn't touched shows an empty box, never the previous photo's text.
function renderPhotoLightbox(a){
  const photos = a.photos || [];
  const i = state.lightboxIdx;
  if(i == null || !photos[i]) return '';
  const ph = photos[i];
  const mine = commentsForPhoto(a, i);
  const draft = state.photoDrafts[photoDraftKey(a, i)] || '';
  const locked = a.status === 'approved';

  return `
  <div id="photo-lightbox" class="lb-scrim" role="dialog" aria-modal="true" aria-label="${escapeAttr(ph.name)}">
    <div class="lb-stage">
      <button data-lb-prev class="lb-arrow lb-arrow-l" aria-label="Previous photo" ${i === 0 ? 'disabled' : ''}>${icon('chevronLeft', 20)}</button>
      <img src="${escapeAttr(ph.reviewLink)}" alt="${escapeAttr(ph.name)}" oncontextmenu="return false">
      <button data-lb-next class="lb-arrow lb-arrow-r" aria-label="Next photo" ${i === photos.length - 1 ? 'disabled' : ''}>${icon('chevronRight', 20)}</button>
    </div>

    <aside class="lb-rail">
      <div class="spread mb-6" style="align-items:flex-start">
        <div class="min-0">
          <div class="display title-lg">${escapeHtml(ph.name)}</div>
          <div class="meta mt-2">PHOTO ${i + 1} OF ${photos.length}</div>
        </div>
        <button id="lb-close" class="btn btn-icon" aria-label="Close">${icon('close', 14)}</button>
      </div>

      <div class="eyebrow mb-3">Notes on this photo</div>
      <div class="lb-notes">
        ${mine.length
          ? mine.map(c => `
            <div class="note-card">
              <span>${escapeHtml(c.text)}</span>
              <div class="meta mt-2">${escapeHtml(c.at)}</div>
            </div>`).join('')
          : `<p class="meta">No notes on this photo yet.</p>`}
      </div>

      ${locked ? `
        <p class="meta">These photos are approved, so notes are closed.</p>
      ` : `
        <label for="lb-text" class="eyebrow" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Note about this photo</label>
        <textarea id="lb-text" class="field mb-3" rows="3" placeholder="Add a note about this photo…">${escapeHtml(draft)}</textarea>
        <button id="lb-submit" class="btn btn-primary btn-block">Add note to this photo</button>
      `}
    </aside>
  </div>`;
}

// Video assets only. Photo notes live in the lightbox, per photo.
function renderRevisionForm(a){
  const hasComments = a.comments.length > 0;
  return `
  <div class="card pad-sm mt-3">
    <label for="revision-text" class="eyebrow" style="display:block;margin-bottom:var(--space-3)">Revision note</label>
    <textarea id="revision-text" class="field mb-3" rows="3" placeholder="Describe the revision needed…">${escapeHtml(state.revisionDraft)}</textarea>
    <div class="row">
      <button id="submit-revision" class="btn btn-primary">Submit revision</button>
      <button id="cancel-revision" class="btn btn-quiet" ${hasComments ? 'disabled title="Remove your notes below to cancel and go back"' : ''}>Cancel revisions</button>
    </div>
  </div>`;
}

/* A review copy that won't load may only mean the session ended (it expired, or the
   studio sent a new code): then the client signs in again rather than being told the
   video is broken. */
function videoFailed(){
  api('/hub/session')
    .then(() => setState({ videoFailed:true }))
    .catch(e => e.status === 401 ? signedOut('Your session ended. Sign in again to carry on.') : setState({ videoFailed:true }));
}

/* ================= helpers ================= */
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function toast(msg){
  // A DOM toast outside render(), so it survives re-renders.
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ================= RENDER ROOT ================= */
function render(){
  detachReviewSource(); // every branch below replaces the DOM, including any <video>
  const root = document.getElementById('app');
  if(state.phase === 'loading'){ root.innerHTML = renderLoading(); return; }
  if(state.phase === 'offline'){
    root.innerHTML = renderOffline();
    document.getElementById('retry').onclick = () => { setState({ phase:'loading' }); boot(); };
    return;
  }
  if(state.phase === 'signin'){ root.innerHTML = renderSignIn(); bindSignIn(); return; }
  if(state.phase === 'notfound'){ root.innerHTML = renderNotFound(); return; }
  if(state.phase === 'dashboard'){ root.innerHTML = renderDashboard(); bindDashboard(); return; }
  if(!state.project){ root.innerHTML = renderLoading(); return; }
  if(state.clientScreen === 'asset' && activeAsset()){ root.innerHTML = renderClientAsset(); bindClientAsset(); return; }
  root.innerHTML = renderClientLanding(); bindClientLanding();
}

/* ================= BINDINGS ================= */
function bindClientLanding(){
  bindClientChrome();
}

function bindClientAsset(){
  bindClientChrome();

  const p = getViewProject();
  const a = activeAsset();

  const video = document.getElementById('asset-video');
  if(video){
    // Drive the pill through setPausePill (no render()): a full re-render would replace
    // the <video> and restart playback from 0.
    video.onplay = () => setPausePill(null);
    video.onpause = () => {
      if(video.ended) return;
      // Timestamps only exist once the client has asked for revisions: an incidental
      // pause while just watching must not stamp anything.
      if(!state.revisionOpen) return;
      setPausePill(fmtVideoTime(video.currentTime));
    };
    // attachReviewSource owns video.onerror (with the hls.js recovery routing).
    attachReviewSource(video, video.dataset.src, videoFailed);
  }
  const retry = document.getElementById('video-retry');
  if(retry) retry.onclick = () => setState({ videoFailed:false });

  bindPhotoThumbs(a);
  bindPhotoLightbox(a);
  // A lightbox opened by its address (a link, a reload) is a dialog: focus goes into it.
  if(state.lightboxIdx != null){
    const into = document.getElementById('lb-text') || document.getElementById('lb-close');
    if(into) into.focus();
  }

  const confirmApprove = document.getElementById('confirm-approve');
  if(confirmApprove) confirmApprove.onclick = () => {
    a.status = 'approved';
    if(p.assets.every(x => x.status === 'approved')) return go(projectHash(p.id));
    setState({ revisionOpen:false, approveModalAssetId:null });
  };
  const cancelApprove = document.getElementById('cancel-approve');
  if(cancelApprove) cancelApprove.onclick = () => setState({ approveModalAssetId:null });
  if(confirmApprove) confirmApprove.focus();

  bindAssetInteraction(a);
}

/* ---------------- photo lightbox ---------------- */
// Repaint ONLY #lightbox-host. A full render() would rebuild the asset screen and reload
// every thumbnail; this keeps navigation instant and the contact sheet untouched.
function refreshLightbox(){
  const host = document.getElementById('lightbox-host');
  if(!host) return;
  const a = activeAsset();
  if(!a) return;
  host.innerHTML = a.type === 'photo' ? renderPhotoLightbox(a) : '';
  bindPhotoLightbox(a);
}

// The photo is in the address (#/p/<id>/d/<item>/<n>), replaced in place.
function photoAddress(i){
  const a = activeAsset(), p = getViewProject();
  if(!a || !p) return;
  const want = reviewHash(p.id, a.id) + (i == null ? '' : '/' + (i + 1));
  if(location.hash !== want) history.replaceState(null, '', want);
}

function openLightbox(i){
  state.lightboxIdx = i;
  photoAddress(i);
  refreshLightbox();
  const box = document.getElementById('lb-text') || document.getElementById('lb-close');
  if(box) box.focus();
}

function closeLightbox(){
  const was = state.lightboxIdx;
  state.lightboxIdx = null;
  photoAddress(null);
  refreshLightbox();
  // The contact sheet's note counts change as notes are added, so repaint it.
  refreshAssetInteraction();
  const canvasHost = document.getElementById('photo-canvas');
  const a = activeAsset();
  if(canvasHost && a){ canvasHost.innerHTML = renderPhotoCanvas(a); bindPhotoThumbs(a); }
  const tile = was != null && document.querySelector(`[data-photo="${was}"]`);
  if(tile) tile.focus();
}

// Step through the library. The draft for the photo being LEFT is already saved under its
// own key, and the photo being entered reads its own, so an untouched photo opens empty.
function stepLightbox(delta){
  const a = activeAsset();
  if(!a) return;
  const next = (state.lightboxIdx == null ? 0 : state.lightboxIdx) + delta;
  if(next < 0 || next >= (a.photos || []).length) return;
  openLightbox(next);
}

function bindPhotoThumbs(a){
  document.querySelectorAll('[data-photo]').forEach(el => {
    el.onclick = () => openLightbox(Number(el.dataset.photo));
  });
}

function bindPhotoLightbox(a){
  const root = document.getElementById('photo-lightbox');
  if(!root) return;
  const prev = root.querySelector('[data-lb-prev]');
  if(prev) prev.onclick = () => stepLightbox(-1);
  const next = root.querySelector('[data-lb-next]');
  if(next) next.onclick = () => stepLightbox(1);
  const close = document.getElementById('lb-close');
  if(close) close.onclick = () => closeLightbox();

  const box = document.getElementById('lb-text');
  if(box){
    const key = photoDraftKey(a, state.lightboxIdx);
    // Saved under THIS photo's key on every keystroke, so arrowing away and back restores
    // the right text and never bleeds it onto a neighbour.
    box.addEventListener('input', () => { state.photoDrafts[key] = box.value; });
  }

  const submit = document.getElementById('lb-submit');
  if(submit) submit.onclick = () => {
    const i = state.lightboxIdx;
    const key = photoDraftKey(a, i);
    const text = (state.photoDrafts[key] || '').trim();
    if(!text) return;
    const ph = (a.photos || [])[i] || {};
    a.comments.push({ text, timestamp: null, photoKey: ph.reviewLink, photoName: ph.name || null, at: nowStr() });
    a.status = 'changes';
    delete state.photoDrafts[key];   // this photo only
    refreshLightbox();
    const again = document.getElementById('lb-text');
    if(again) again.focus();
  };
}

// Escape closes, arrows walk the library, but never while the client is typing a note.
document.addEventListener('keydown', (e) => {
  if(state.approveModalAssetId && e.key === 'Escape'){ e.preventDefault(); setState({ approveModalAssetId:null }); return; }
  if(state.lightboxIdx == null) return;
  const typing = e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT');
  if(e.key === 'Escape'){ e.preventDefault(); closeLightbox(); return; }
  if(typing) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); stepLightbox(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); stepLightbox(1); }
});

// mm:ss for the review-timestamp pill.
function fmtVideoTime(seconds){
  const t = Math.max(0, Math.floor(seconds || 0));
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
}

// #pause-pill sits outside #asset-interaction (next to the player), so it's updated in
// place rather than re-rendered. null clears the stamp and hides the pill.
function setPausePill(value){
  state.pausedAt = value || null;
  const pill = document.getElementById('pause-pill');
  if(!pill) return;
  if(state.pausedAt){
    const label = document.getElementById('pause-pill-time');
    if(label) label.textContent = state.pausedAt;
    pill.style.display = '';
  } else {
    pill.style.display = 'none';
  }
}

// Bindings for everything inside #asset-interaction, on a full render and again after
// each partial repaint. These handlers use refreshAssetInteraction(), NOT setState(), so
// the <video> survives with its playhead. approve-asset is the exception: it opens a
// dialog outside this container.
function bindAssetInteraction(a){
  const approveBtn = document.getElementById('approve-asset');
  if(approveBtn) approveBtn.onclick = () => setState({ approveModalAssetId: a.id });

  const wantRev = document.getElementById('want-revisions');
  if(wantRev) wantRev.onclick = () => {
    state.revisionOpen = !state.revisionOpen;
    const video = document.getElementById('asset-video');
    if(state.revisionOpen){
      // Opening the panel arms the timestamp. Stamp the playhead only if the client is
      // parked on a frame: a stamp taken mid-playback would be stale by the time they type.
      setPausePill(video && video.paused && video.currentTime > 0 ? fmtVideoTime(video.currentTime) : null);
    } else {
      setPausePill(null);
    }
    refreshAssetInteraction();
    const box = document.getElementById('revision-text');
    if(box) box.focus();
  };

  const revText = document.getElementById('revision-text');
  if(revText) revText.addEventListener('input', () => { state.revisionDraft = revText.value; });

  const submitRev = document.getElementById('submit-revision');
  if(submitRev) submitRev.onclick = () => {
    if(!state.revisionDraft.trim()) return;
    a.comments.push({ text: state.revisionDraft.trim(), timestamp: state.pausedAt || null, photoKey: null, photoName: null, at: nowStr() });
    a.status = 'changes';
    // The panel stays OPEN with an empty box: a client usually has more than one note.
    // Only #asset-interaction repaints, so the playhead is untouched.
    state.revisionDraft = '';
    refreshAssetInteraction();
    const nextBox = document.getElementById('revision-text');
    if(nextBox) nextBox.focus();
  };

  const cancelRev = document.getElementById('cancel-revision');
  if(cancelRev) cancelRev.onclick = () => {
    if(a.comments.length) return;
    state.revisionOpen = false;
    state.revisionDraft = '';
    setPausePill(null);
    refreshAssetInteraction();
    const again = document.getElementById('want-revisions');
    if(again) again.focus();
  };
}

// An invite opened in a tab already on the portal changes only the fragment, which
// doesn't reload the page, so it's read here too.
window.addEventListener('hashchange', route);

render();
boot();
</script>
</body>
</html>
