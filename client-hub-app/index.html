/* Why a note didn't save, in plain words. The text always stays where it was typed. */
function noteFailure(e){
  if(!e || e.status === 0) return 'Your note wasn’t saved: there’s no connection. It’s still in the box, so try again.';
  if(e.code === 'preview') return PREVIEW_REFUSED;
  if(e.status === 401) return 'You’ve been signed out, so your note wasn’t saved. Copy it, then sign in again.';
  if(e.status === 429) return 'Too many notes at once. Wait a minute, then try again. Your note is still in the box.';
  if(e.code === 'not_current') return 'There’s a newer version of this now. Copy your note, then reload the page to see the new version.';
  if(e.code === 'sent') return 'Your notes on this version have already been sent.';
  if(e.code === 'archived' || e.code === 'approved') return 'Notes are closed on this one.';
  if(e.code === 'too_many') return 'That’s a lot of notes. Send these to the studio first, then add more.';
  return 'Your note wasn’t saved. It’s still in the box, so try again.';
}

/* A key the page gives each note before saving it, kept across retries of the same text:
   if a save lands but its reply is lost, the retry gets back the note already saved. */
const newNoteKey = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)));

/* Saves one note (C4), adds it to the project as it is now (the copy on screen may have been
   read fresh while it saved), and gives back the page's copy, or throws as api() does. */
async function saveNote(a, body){
  const p = getViewProject();
  const r = await api('/hub/projects/' + encodeURIComponent(p.id) + '/items/' + encodeURIComponent(a.id) + '/notes',
    { method:'POST', body: Object.assign({ versionId: a.versionId }, body) });
  const note = Object.assign(noteOf(r.note, a), { n: a.n });
  const now = state.cache[p.id] && state.cache[p.id].assets.find(x => x.id === a.id && x.versionId === a.versionId);
  [a, now].forEach(x => { if(x && !x.comments.some(c => c.id === note.id)) x.comments.push(note); });
  return note;
}

/* A review copy that won't load may only mean the session ended (it expired, or the
   studio sent a new code): then the client signs in again rather than being told the
   video is broken. */
function videoFailed(){
  api('/hub/session')
    .then(() => setState({ videoFailed:true }))
    .catch(e => e.status === 401 ? (state.preview ? previewOver('expired') : signedOut('Your session ended. Sign in again to carry on.')) : setState({ videoFailed:true }));
}

/* ================= helpers ================= */
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function toast(msg){
  // A DOM toast outside render(), so it survives re-renders.
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ================= RENDER ROOT ================= */
function render(){
  detachReviewSource(); // every branch below replaces the DOM, including any <video>
  const root = document.getElementById('app');
  if(state.phase === 'loading'){ root.innerHTML = renderLoading(); return; }
  if(state.phase === 'offline'){
    root.innerHTML = renderOffline();
    document.getElementById('retry').onclick = () => {
      setState({ phase:'loading' });
      if(state.previewToken) openPreview(state.previewToken); else boot();
    };
    return;
  }
  if(state.phase === 'signin'){ root.innerHTML = renderSignIn(); bindSignIn(); return; }
  if(state.phase === 'notfound'){ root.innerHTML = renderNotFound(); return; }
  if(state.phase === 'previewEnded'){ root.innerHTML = renderPreviewEnded(); return; }
  if(state.phase === 'dashboard'){ root.innerHTML = renderDashboard(); bindDashboard(); return; }
  if(!state.project){ root.innerHTML = renderLoading(); return; }
  if(state.clientScreen === 'asset' && activeAsset()){ root.innerHTML = renderClientAsset(); bindClientAsset(); return; }
  root.innerHTML = renderClientLanding(); bindClientLanding();
}

/* ================= BINDINGS ================= */
function bindClientLanding(){
  bindClientChrome();
}

function bindClientAsset(){
  bindClientChrome();

  const p = getViewProject();
  const a = activeAsset();

  const video = document.getElementById('asset-video');
  if(video){
    // Drive the pill through setPausePill (no render()): a full re-render would replace
    // the <video> and restart playback from 0.
    video.onplay = () => setPausePill(null);
    video.onpause = () => {
      if(video.ended) return;
      // Timestamps only exist once the client has asked for revisions: an incidental
      // pause while just watching must not stamp anything.
      if(!state.revisionOpen) return;
      setPausePill(fmtVideoTime(video.currentTime), video.currentTime);
    };
    // attachReviewSource owns video.onerror (with the hls.js recovery routing).
    attachReviewSource(video, video.dataset.src, videoFailed);
  }
  const retry = document.getElementById('video-retry');
  if(retry) retry.onclick = () => setState({ videoFailed:false });

  bindPhotoThumbs(a);
  bindPhotoLightbox(a);
  // A lightbox opened by its address (a link, a reload) is a dialog: focus goes into it.
  if(state.lightboxIdx != null){
    const into = document.getElementById('lb-text') || document.getElementById('lb-rounds-continue') || document.getElementById('lb-close');
    if(into) into.focus();
  }

  // CONFIRM APPROVAL (C5): recorded on the server against this version. A failure keeps
  // the dialog open and says why; nothing is approved until the server says so.
  const confirmApprove = document.getElementById('confirm-approve');
  if(confirmApprove) confirmApprove.onclick = async () => {
    if(state.approving) return;
    setState({ approving:true, approveError:null });
    try {
      const r = await api('/hub/projects/' + encodeURIComponent(p.id) + '/items/' + encodeURIComponent(a.id) + '/approve',
        { method:'POST', body:{ versionId: a.versionId } });
      // Onto this copy and the project as it is now (it may have been read fresh meanwhile).
      // The item's status is the server's: a newer file the studio added means it isn't
      // signed off, whatever this approval says.
      const now = state.cache[p.id];
      [p, now].forEach(x => {
        if(!x) return;
        const asset = x.assets.find(y => y.id === a.id && y.versionId === a.versionId);
        if(asset) asset.approvedAt = r.approval.approvedAt;
        const item = x.items.find(y => y.id === a.id);
        if(item && r.itemStatus) item.status = r.itemStatus;
      });
      a.approvedAt = r.approval.approvedAt;
      state.approving = false;
      if(p.items.length && p.items.every(i => i.status === 'approved')) return go(projectHash(p.id));
      setState({ revisionOpen:false, roundsNotice:false, approveModalAssetId:null });
      toast(a.stage === 'final' ? 'Approved. Thanks.' : 'Draft approved. We’ll get on with the final.');
    } catch(e){
      // The version moved on, this was settled in another tab, or the studio closed it
      // (archived, or marked not needed): trying again can't work, so show it as it is now.
      const SETTLED = {
        not_current: 'There’s a newer version of this now.',
        sent: 'Your notes on this version were sent, so it waits for the next one.',
        approved: 'This was already approved.',
        archived: 'This project is closed, so nothing was approved.',
        not_found: 'This isn’t up for review any more, so nothing was approved.',
      };
      if(Object.hasOwn(SETTLED, e.code)){
        delete state.cache[p.id];
        setState({ approving:false, approveModalAssetId:null });
        toast(SETTLED[e.code]);
        return route();
      }
      setState({ approving:false, approveError: e.code === 'preview' ? PREVIEW_REFUSED : e.status === 401
        ? 'You’ve been signed out, so nothing was approved. Sign in again to approve.'
        : e.status === 0 ? 'Nothing was approved: there’s no connection. Try again.'
        : e.code === 'unsent_notes' ? 'You have notes that haven’t been sent. Send or remove them first.'
        : 'Nothing was approved. Try again.' });
    }
  };

  // Send: every unsent note on this version, as one set (C4). A failure keeps the dialog
  // open and says why; nothing is lost, because the notes are already saved.
  const confirmSend = document.getElementById('confirm-send');
  if(confirmSend) confirmSend.onclick = async () => {
    if(state.sending) return;
    setState({ sending:true, sendError:null });
    try {
      const r = await api('/hub/projects/' + encodeURIComponent(p.id) + '/items/' + encodeURIComponent(a.id) + '/submit',
        { method:'POST', body:{ versionId: a.versionId } });
      a.submittedAt = r.submittedAt;
      a.comments.forEach(c => { if(!c.submittedAt) c.submittedAt = r.submittedAt; });
      if(r.rounds) a.rounds = r.rounds;
      setState({ sending:false, sendModalAssetId:null, revisionOpen:false, pausedAt:null, pausedSeconds:null });
      toast('Your notes were sent to the studio.');
    } catch(e){
      if(e.code === 'sent'){
        // Sent already (another tab, or a retry): read the project again to show it.
        delete state.cache[p.id];
        setState({ sending:false, sendModalAssetId:null });
        return route();
      }
      setState({ sending:false, sendError: e.code === 'preview' ? PREVIEW_REFUSED : e.status === 401
        ? 'You’ve been signed out. Your notes are saved: sign in again to send them.'
        : e.code === 'no_notes' ? 'There are no unsent notes to send.'
        : 'Your notes weren’t sent. They’re still saved here, so try again.' });
    }
  };
  const cancelSend = document.getElementById('cancel-send');
  if(cancelSend) cancelSend.onclick = () => setState({ sendModalAssetId:null, sendError:null });
  if(confirmSend) confirmSend.focus();
  const cancelApprove = document.getElementById('cancel-approve');
  if(cancelApprove) cancelApprove.onclick = () => setState({ approveModalAssetId:null, approveError:null });
  if(confirmApprove) confirmApprove.focus();

  bindAssetInteraction(a);
}

/* ---------------- photo lightbox ---------------- */
// Repaint ONLY #lightbox-host. A full render() would rebuild the asset screen and reload
// every thumbnail; this keeps navigation instant and the contact sheet untouched.
function refreshLightbox(){
  const host = document.getElementById('lightbox-host');
  if(!host) return;
  const a = activeAsset();
  if(!a) return;
  host.innerHTML = a.type === 'photo' ? renderPhotoLightbox(a) : '';
  bindPhotoLightbox(a);
}

// The photo is in the address (#/p/<id>/d/<item>/<n>), replaced in place.
function photoAddress(i){
  const a = activeAsset(), p = getViewProject();
  if(!a || !p) return;
  const want = reviewHash(p.id, a.id) + (i == null ? '' : '/' + (i + 1));
  if(location.hash !== want) history.replaceState(null, '', want);
}

function openLightbox(i){
  state.lightboxIdx = i;
  state.lbError = null;
  photoAddress(i);
  refreshLightbox();
  const box = document.getElementById('lb-text') || document.getElementById('lb-rounds-continue') || document.getElementById('lb-close');
  if(box) box.focus();
}

function closeLightbox(){
  const was = state.lightboxIdx;
  state.lightboxIdx = null;
  photoAddress(null);
  refreshLightbox();
  // The contact sheet's note counts change as notes are added, so repaint it.
  refreshAssetInteraction();
  const canvasHost = document.getElementById('photo-canvas');
  const a = activeAsset();
  if(canvasHost && a){ canvasHost.innerHTML = renderPhotoCanvas(a); bindPhotoThumbs(a); }
  const tile = was != null && document.querySelector(`[data-photo="${was}"]`);
  if(tile) tile.focus();
}

// Step through the library. The draft for the photo being LEFT is already saved under its
// own key, and the photo being entered reads its own, so an untouched photo opens empty.
function stepLightbox(delta){
  const a = activeAsset();
  if(!a) return;
  const next = (state.lightboxIdx == null ? 0 : state.lightboxIdx) + delta;
  if(next < 0 || next >= (a.photos || []).length) return;
  openLightbox(next);
}

function bindPhotoThumbs(a){
  document.querySelectorAll('[data-photo]').forEach(el => {
    el.onclick = () => openLightbox(Number(el.dataset.photo));
  });
}

function bindPhotoLightbox(a){
  const root = document.getElementById('photo-lightbox');
  if(!root) return;
  const prev = root.querySelector('[data-lb-prev]');
  if(prev) prev.onclick = () => stepLightbox(-1);
  const next = root.querySelector('[data-lb-next]');
  if(next) next.onclick = () => stepLightbox(1);
  const close = document.getElementById('lb-close');
  if(close) close.onclick = () => closeLightbox();
  // The rounds-used notice (C5): Go back leaves the photo, Continue opens its note box.
  const roundsBack = document.getElementById('lb-rounds-back');
  if(roundsBack) roundsBack.onclick = () => closeLightbox();
  const roundsOn = document.getElementById('lb-rounds-continue');
  if(roundsOn) roundsOn.onclick = () => {
    state.roundsOk[a.versionId] = true;
    refreshLightbox();
    const box = document.getElementById('lb-text');
    if(box) box.focus();
  };

  const box = document.getElementById('lb-text');
  if(box){
    const key = photoDraftKey(a, state.lightboxIdx);
    // Saved under THIS photo's key on every keystroke, so arrowing away and back restores
    // the right text and never bleeds it onto a neighbour.
    box.addEventListener('input', () => { state.photoDrafts[key] = box.value; delete state.photoNoteKeys[key]; });
  }

  const submit = document.getElementById('lb-submit');
  if(submit) submit.onclick = async () => {
    const i = state.lightboxIdx;
    const key = photoDraftKey(a, i);
    const text = (state.photoDrafts[key] || '').trim();
    if(!text || state.lbSaving) return;
    const ph = (a.photos || [])[i] || {};
    const photo = (/photo=([0-9a-f]{16})/.exec(ph.reviewLink || '') || [])[1];
    state.lbSaving = true; state.lbError = null;
    refreshLightbox();
    if(!state.photoNoteKeys[key]) state.photoNoteKeys[key] = newNoteKey();
    try {
      await saveNote(a, { text, photo, key: state.photoNoteKeys[key] });
      delete state.photoDrafts[key];   // this photo only, and only once it's saved
      delete state.photoNoteKeys[key];
    } catch(e){
      state.lbError = noteFailure(e);  // the draft stays under its key, so the box keeps the text
    }
    state.lbSaving = false;
    if(state.lightboxIdx !== i) return; // the client moved on; the note (or its draft) waits on its photo
    refreshLightbox();
    const again = document.getElementById('lb-text');
    if(again) again.focus();
  };
}

// Escape closes, arrows walk the library, but never while the client is typing a note.
document.addEventListener('keydown', (e) => {
  if(state.approveModalAssetId && e.key === 'Escape' && !state.approving){ e.preventDefault(); setState({ approveModalAssetId:null, approveError:null }); return; }
  if(state.sendModalAssetId && e.key === 'Escape' && !state.sending){ e.preventDefault(); setState({ sendModalAssetId:null, sendError:null }); return; }
  if(state.lightboxIdx == null) return;
  const typing = e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT');
  if(e.key === 'Escape'){ e.preventDefault(); closeLightbox(); return; }
  if(typing) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); stepLightbox(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); stepLightbox(1); }
});

// mm:ss for the review-timestamp pill.
function fmtVideoTime(seconds){
  const t = Math.max(0, Math.floor(seconds || 0));
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
}

// #pause-pill sits outside #asset-interaction (next to the player), so it's updated in
// place rather than re-rendered. null clears the stamp and hides the pill.
function setPausePill(value, seconds){
  state.pausedAt = value || null;
  state.pausedSeconds = value && typeof seconds === 'number' ? seconds : null;
  const pill = document.getElementById('pause-pill');
  if(!pill) return;
  if(state.pausedAt){
    const label = document.getElementById('pause-pill-time');
    if(label) label.textContent = state.pausedAt;
    pill.style.display = '';
  } else {
    pill.style.display = 'none';
  }
}

// Bindings for everything inside #asset-interaction, on a full render and again after
// each partial repaint. These handlers use refreshAssetInteraction(), NOT setState(), so
// the <video> survives with its playhead. approve-asset is the exception: it opens a
// dialog outside this container.
function bindAssetInteraction(a){
  const approveBtn = document.getElementById('approve-asset');
  if(approveBtn) approveBtn.onclick = () => { if(!unsentOf(a).length) setState({ approveModalAssetId: a.id }); };
  // Send opens its dialog, outside this container, as Approve does.
  const sendBtn = document.getElementById('send-notes');
  if(sendBtn) sendBtn.onclick = () => setState({ sendModalAssetId: a.id, sendError:null });

  // Remove an unsent note: only this container repaints.
  document.querySelectorAll('[data-remove-note]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.removeNote;
      const p = getViewProject();
      btn.disabled = true;
      try {
        await api('/hub/projects/' + encodeURIComponent(p.id) + '/notes/' + encodeURIComponent(id), { method:'DELETE' });
        a.comments = a.comments.filter(c => c.id !== id);
      } catch(e){
        toast(e.code === 'preview' ? PREVIEW_REFUSED : e.status === 0 ? 'That note wasn’t removed: there’s no connection.' : e.code === 'sent' ? 'That note was already sent.' : 'That note wasn’t removed. Try again.');
      }
      refreshAssetInteraction();
    };
  });

  const toggleRevisions = () => {
    state.revisionOpen = !state.revisionOpen;
    const video = document.getElementById('asset-video');
    if(state.revisionOpen){
      // Opening the panel arms the timestamp. Stamp the playhead only if the client is
      // parked on a frame: a stamp taken mid-playback would be stale by the time they type.
      setPausePill(video && video.paused && video.currentTime > 0 ? fmtVideoTime(video.currentTime) : null, video && video.currentTime);
    } else {
      setPausePill(null);
    }
    refreshAssetInteraction();
    const box = document.getElementById('revision-text');
    if(box) box.focus();
  };
  const wantRev = document.getElementById('want-revisions');
  if(wantRev) wantRev.onclick = () => {
    // Both rounds used: the notice comes first, once per version (C5). Only this container repaints.
    if(!state.revisionOpen && roundsOut(a) && !state.roundsOk[a.versionId]){
      state.roundsNotice = true;
      refreshAssetInteraction();
      const next = document.getElementById('rounds-continue');
      if(next) next.focus();
      return;
    }
    toggleRevisions();
  };
  const roundsBack = document.getElementById('rounds-back');
  if(roundsBack) roundsBack.onclick = () => {
    state.roundsNotice = false;
    refreshAssetInteraction();
    const again = document.getElementById('want-revisions');
    if(again) again.focus();
  };
  const roundsOn = document.getElementById('rounds-continue');
  if(roundsOn) roundsOn.onclick = () => {
    state.roundsOk[a.versionId] = true;
    state.roundsNotice = false;
    toggleRevisions();
  };

  const revText = document.getElementById('revision-text');
  if(revText) revText.addEventListener('input', () => { state.revisionDraft = revText.value; state.noteKey = null; });

  // Add note (contract point 3): saved on the server as it's added; the panel stays OPEN
  // with an empty box, because a client usually has more than one. Only
  // #asset-interaction repaints, so the playhead is untouched. A failure keeps the text
  // in the box and says why: a note is never silently dropped.
  const submitRev = document.getElementById('submit-revision');
  if(submitRev) submitRev.onclick = async () => {
    const text = state.revisionDraft.trim();
    if(!text || state.noteSaving) return;
    state.noteSaving = true; state.noteError = null;
    refreshAssetInteraction();
    if(!state.noteKey) state.noteKey = newNoteKey();
    try {
      await saveNote(a, { text, seconds: state.pausedAt ? state.pausedSeconds : null, key: state.noteKey });
      state.revisionDraft = '';
      state.noteKey = null;
    } catch(e){
      state.noteError = noteFailure(e);
    }
    state.noteSaving = false;
    if(activeAsset() !== a) return; // the client moved on while it saved
    refreshAssetInteraction();
    const nextBox = document.getElementById('revision-text');
    if(nextBox) nextBox.focus();
  };

  const cancelRev = document.getElementById('cancel-revision');
  if(cancelRev) cancelRev.onclick = () => {
    if(unsentOf(a).length) return;
    state.revisionOpen = false;
    state.revisionDraft = '';
    state.noteError = null;
    setPausePill(null);
    refreshAssetInteraction();
    const again = document.getElementById('want-revisions');
    if(again) again.focus();
  };
}

// An invite opened in a tab already on the portal changes only the fragment, which
// doesn't reload the page, so it's read here too.
window.addEventListener('hashchange', route);
// The preview bar wraps to more lines on a narrow screen: the page keeps room for it.
window.addEventListener('resize', () => { if(state.preview) roomForPreviewBar(); });

render();
boot();
</script>
</body>
</html>
