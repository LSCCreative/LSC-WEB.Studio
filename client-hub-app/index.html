<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Hub — LSC Creative</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Cursive fonts for the typed signature generator on the agreement screen -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Sacramento&display=swap" rel="stylesheet">
<style>
  /* @font-face rules are injected at runtime from HUB_CONFIG.assetBase (see script top),
     so a subdomain cutover only touches assetBase — not this stylesheet. */
  :root{
    --lsc-black:#0E0E0E; --lsc-surface:#1C1F24; --lsc-surface-lt:#252930;
    --lsc-white:#F0EDE8; --lsc-mid:#7A7470; --lsc-rule:rgba(240,237,232,0.12);
    --lsc-terra:#C0603C; --lsc-terra-dk:#8C4832;
    --lsc-sage:#8FA89B; --lsc-sage-dk:#6A8E82;
    --lsc-amber:#D9A441; --lsc-red:#C0503C;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--lsc-black); color:var(--lsc-white);
    font-family:"Funnel Sans","Outfit",sans-serif;
    min-height:100vh; margin:0;
  }
  .mono{ font-family:"CS-Felice-Mono","Outfit",monospace; letter-spacing:.08em; }
  .display{ font-family:"Delight","Outfit",sans-serif; }
  ::selection{ background:var(--lsc-terra); color:#fff; }

  /* ---- PIN LOCK ---- */
  .shake{ animation:shakeAnim .4s ease; }
  @keyframes shakeAnim{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-8px)}
    40%,60%{transform:translateX(8px)}
  }

  /* ---- photo lightbox ---- */
  /* Full-bleed review surface: one photo large enough to actually judge, with its own
     comment rail. Stacks under the image on phones, sits beside it from md up. */
  .lb-scrim{
    position:fixed; inset:0; z-index:50;
    background:rgba(14,14,14,.93);
    backdrop-filter:blur(10px);
    display:flex; flex-direction:column;
  }
  .lb-stage{
    position:relative; flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:.75rem;
  }
  .lb-stage img{
    max-width:100%; max-height:100%;
    object-fit:contain; display:block;
    border-radius:.4rem;
  }
  /* Hairline ghost arrows, vertically centred over the image edges. 44px min touch
     target on phones per the mobile rules. */
  .lb-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(14,14,14,.6); border:1px solid var(--lsc-rule);
    color:var(--lsc-white); cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .lb-arrow:hover{ border-color:var(--lsc-sage); background:rgba(14,14,14,.85); }
  .lb-arrow[disabled]{ opacity:.25; cursor:not-allowed; }
  .lb-arrow-l{ left:.5rem; }
  .lb-arrow-r{ right:.5rem; }
  /* Deeper than .card so the note cards read as raised against the rail rather than
     disappearing into it — both would otherwise be --lsc-surface. */
  .lb-rail{
    flex:0 0 auto; max-height:45vh; overflow-y:auto;
    border-top:1px solid var(--lsc-rule); background:var(--lsc-black);
  }
  @media (min-width:768px){
    .lb-scrim{ flex-direction:row; }
    .lb-stage{ padding:2rem; }
    .lb-arrow-l{ left:1.25rem; }
    .lb-arrow-r{ right:1.25rem; }
    .lb-rail{
      flex:0 0 340px; max-height:none; height:100%;
      border-top:none; border-left:1px solid var(--lsc-rule);
    }
  }
  @media (prefers-reduced-motion:reduce){
    .lb-arrow{ transition:none; }
  }

  /* ---- asset card thumbnails ---- */
  /* 16:9 media preview at the top of each deliverable card on the client landing.
     The placeholder sits under the media, so a still-loading or failed thumbnail
     degrades to the icon rather than a blank rectangle. */
  .asset-thumb{
    position:relative; aspect-ratio:16/9; width:100%; overflow:hidden;
    border-radius:.55rem; background:var(--lsc-surface);
    border:1px solid var(--lsc-rule); margin-bottom:1rem;
  }
  .asset-thumb > img, .asset-thumb > video{
    position:relative; z-index:1;
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .asset-thumb .thumb-fallback{
    position:absolute; inset:0; z-index:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--lsc-mid);
  }
  /* Photo libraries preview up to three images as a filmstrip. */
  .asset-thumb.is-strip{ display:flex; gap:2px; }
  .asset-thumb.is-strip > img{ flex:1 1 0; min-width:0; }
  .card:hover .asset-thumb{ border-color:var(--lsc-sage); }

  /* Replaces the emoji status dot — inherits the badge's own colour. */
  .status-dot{
    display:inline-block; width:.5em; height:.5em; border-radius:50%;
    background:currentColor; margin-right:.5em; vertical-align:.08em;
  }

  /* ---- badges ---- */
  .badge-reviewing{ background:rgba(217,164,65,.15); color:var(--lsc-amber); border:1px solid rgba(217,164,65,.35);}
  .badge-changes{ background:rgba(192,80,60,.15); color:var(--lsc-terra); border:1px solid rgba(192,80,60,.35);}
  .badge-approved{ background:rgba(143,168,155,.15); color:var(--lsc-sage); border:1px solid rgba(143,168,155,.35);}
  /* smart state badges (F4) — reuse existing tokens */
  .badge-deposit{ background:rgba(143,168,155,.14); color:var(--lsc-sage); border:1px solid rgba(143,168,155,.4);}
  .badge-ready{ background:rgba(217,164,65,.14); color:var(--lsc-amber); border:1px solid rgba(217,164,65,.4);}
  .badge-complete{ background:var(--lsc-sage-dk); color:#fff; border:1px solid var(--lsc-sage);}

  .card{ background:var(--lsc-surface); border:1px solid var(--lsc-rule); }
  .field{
    background:var(--lsc-black); border:1px solid var(--lsc-rule); color:var(--lsc-white);
    border-radius:8px; padding:10px 12px; width:100%; font-size:.9rem;
  }
  .field:focus{ outline:none; border-color:var(--lsc-sage); }
  .field.invalid{ border-color:var(--lsc-red); }
  .btn-terra{ background:var(--lsc-terra); color:#fff; }
  .btn-terra:hover{ background:var(--lsc-terra-dk); }
  .btn-sage{ background:transparent; border:1px solid var(--lsc-sage); color:var(--lsc-sage); }
  .btn-sage:hover{ background:rgba(143,168,155,.1); }
  .btn-ghost{ background:transparent; border:1px solid var(--lsc-rule); color:var(--lsc-mid); }
  .btn-ghost:hover{ color:var(--lsc-white); border-color:var(--lsc-mid); }

  .timestamp-pill{
    animation:pillIn .2s ease;
  }
  @keyframes pillIn{ from{opacity:0; transform:translateY(4px) scale(.9);} to{opacity:1; transform:none;} }

  .toast{ animation:toastIn .3s ease; }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;} }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--lsc-surface-lt); border-radius:4px; }

  /* Desktop-only: pin the "back to site" link to the top-left corner of
     login screens instead of stacking it inline above the form. Mobile
     (<=992px) keeps the original inline/centered placement untouched. */
  @media (min-width: 993px){
    .back-link{ position:fixed; top:32px; left:32px; margin-bottom:0; }
  }

  /* iOS zooms the page when a focused input is under 16px. Desktop sizing is
     untouched — this only lifts fields at phone width. */
  @media (max-width:767px){
    .field{ font-size:16px; }
  }

</style>
</head>
<body>

<div id="app"></div>

<!-- Modular email stub — loads before the main script; exposes window.emailService. -->
<script src="emailService.js"></script>
<script>
/* =========================================================
   CLIENT PROOFING & DELIVERY HUB — SIMULATE MODE PROTOTYPE
   No live network calls. State persists to localStorage only.
   ========================================================= */

/* ---------------------------------------------------------
   HUB_CONFIG — single source of truth for environment + routing.
   Non-secret only. Secrets live ONLY server-side on the NAS
   (client-hub-api), never here or anywhere in client-hub-app/.
   Subdomain cutover = change basePath / assetBase / mainSiteUrl only.
   --------------------------------------------------------- */
const HUB_CONFIG = {
  mode:           'live',                                  // 'simulate' | 'live'
  mainSiteUrl:    '../index.html',                         // back-link to host site
  assetBase:      '../assets/',                            // fonts/images root (font @font-face derives from this)
  basePath:       './',                                    // hub's own base (for building client links)
  edgeBase:       'https://hub-api.lsccreative.studio',    // self-hosted NAS API (routes /hub/*), see nas/client-hub-api/
};
/* mode:'simulate' uses localStorage and skips every /hub/* call — useful for
   local UI work without a NAS connection. 'live' talks to edgeBase for real. */

/* Inject brand @font-face rules from HUB_CONFIG.assetBase so a subdomain
   move only touches assetBase (these paths are exactly what break on a subdomain). */
(function injectFonts(){
  const f = HUB_CONFIG.assetBase + 'fonts/';
  const css =
    `@font-face{font-family:"Delight";`+
      `src:url("${f}delight/Delight-SemiBold.woff2") format("woff2"),`+
          `url("${f}delight/Delight-Bold.woff2") format("woff2");font-weight:600;}`+
    `@font-face{font-family:"CS-Felice-Mono";`+
      `src:url("${f}cs-felice-mono/CSFeliceMono-Regular.woff2") format("woff2"),`+
          `url("${f}cs-felice-mono/CSFeliceMono-Regular.woff") format("woff");font-weight:400;}`;
  const el = document.createElement('style'); el.textContent = css; document.head.appendChild(el);
})();

const STORAGE_KEY = 'lsc_hub_projects_v1';
const AUTH_KEY = 'lsc_hub_auth_v1';

const uid = () => Math.random().toString(36).slice(2, 9);
const nowStr = () => new Date().toLocaleString('en-AU', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const isValidUrl = (v) => /^https:\/\/.+/i.test((v||'').trim());

/* ---------------- Sprint C: accounts / persistence layer ---------------- */
const CLIENT_TOKEN_SS = 'lsc_hub_client_token'; // client session token from /hub/auth
const REC_PREFIX      = 'lsc_hub_record_';       // SIMULATE published safe record store
const PRIV_PREFIX     = 'lsc_hub_private_';      // SIMULATE private auth record store

const gen4     = () => String(Math.floor(1000 + Math.random()*9000));      // 4-digit client code
const genToken = () => (uid()+uid()+uid()+uid()).slice(0,24);              // invite / session token

async function sha256Hex(str){
  const data = new TextEncoder().encode(String(str));
  const buf  = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Authed fetch to the NAS API (live only). `credentials:'include'` sends the
// HttpOnly hub_admin_session cookie cross-origin once /hub/admin-auth has set
// one (Slice 6) — that cookie is the only admin auth mechanism now.
async function hubFetch(path, opts={}){
  const headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers||{});
  const res = await fetch(HUB_CONFIG.edgeBase + path, { ...opts, headers, credentials:'include' });
  if(!res.ok){
    const err = new Error(path + ' → ' + res.status);
    err.status = res.status;              // callers branch on 401 (expired/missing session)
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

/* A 401 here means the admin session cookie is missing or expired — send the
   admin back to the PIN screen rather than leaving them stuck retrying. */
function reportAdminError(e, what){
  console.error(what + ' failed:', e);
  if(e && e.status === 401){
    sessionStorage.removeItem(AUTH_KEY);
    toast('⚠ Admin session expired — please sign in again.');
    setState({ authed:false, pinInput:'', screen:'tracker' });
    return;
  }
  toast('⚠ ' + what + ' failed — see console.');
}

// SAFE published subset (§3.2): NEVER includes clientCode, inviteToken, or clientEmail.
function buildPublishedRecord(p){
  return {
    id: p.id, upid: p.upid, name: p.name, message: p.message,
    invoices: (p.invoices||[]).map(i => ({ type:i.type, name:i.name, url:i.url||'' })),
    delivered: !!p.delivered,
    // Portal-compatible asset field names retained (reviewLink/downloadLink/driveLink).
    assets: (p.assets||[]).map(a => ({
      id:a.id, type:a.type, title:a.title, status:a.status, comments:a.comments||[],
      reviewLink:a.reviewLink||'', downloadLink:a.downloadLink||'', driveLink:a.driveLink||'',
      // This map whitelists fields — without photos here the client record would
      // carry no photo library at all and the grid would render empty.
      gated: a.gated !== false,
      photos: (a.photos||[]).map(ph => ({ name:ph.name||'', reviewLink:ph.reviewLink||'', downloadLink:ph.downloadLink||'' }))
    }))
  };
}

/* Mode-branched backend. SIMULATE = localStorage; LIVE = Bunny Edge Script.
   The public read path (fetchRecord via pull zone) is what makes a client link
   work on their OWN device — the known cross-device blocker. */
const hubApi = {
  // ADMIN write: publish the safe record + the private auth record (codeHash only).
  async publish(p){
    const record   = buildPublishedRecord(p);
    const codeHash = p.clientCode ? await sha256Hex(p.clientCode) : null;
    // priv stays server-side only (Edge-Rule blocked /private). inviteToken here lets the
    // Edge Script build a token→project index for ?invite= onboarding.
    const priv     = { projectId:p.id, clientEmail:(p.clientEmail||''), codeHash, delivered:!!p.delivered, inviteToken:(p.inviteToken||'') };
    if(HUB_CONFIG.mode === 'live'){
      await hubFetch('/hub/publish', { method:'POST', body: JSON.stringify({ record, priv }) });
    } else {
      localStorage.setItem(REC_PREFIX + p.id, JSON.stringify(record));
      localStorage.setItem(PRIV_PREFIX + p.id, JSON.stringify(priv));
    }
    p.publishedAt = new Date().toISOString();
    return record;
  },
  // CLIENT auth: email + code → { token, projectIds }. Codes compared as SHA-256 only.
  async authClient(email, code){
    if(HUB_CONFIG.mode === 'live'){
      return hubFetch('/hub/auth', { method:'POST', body: JSON.stringify({ email, code }) });
    }
    const codeHash = await sha256Hex(code);
    const projectIds = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf(PRIV_PREFIX) !== 0) continue;
      let rec; try{ rec = JSON.parse(localStorage.getItem(k)); }catch(_){ continue; }
      if(rec && rec.clientEmail && email &&
         rec.clientEmail.toLowerCase() === email.trim().toLowerCase() &&
         rec.codeHash === codeHash){ projectIds.push(rec.projectId); }
    }
    return projectIds.length ? { token:'sim-'+genToken(), projectIds } : { token:null, projectIds:[] };
  },
  // CLIENT read: fetch a published record. Live uses the pre-signed pull-zone URL that
  // /hub/auth returned (Bunny token-auth); simulate reads the local record store.
  async fetchRecord(projectId, auth){
    if(HUB_CONFIG.mode === 'live'){
      const url = auth && auth.records && auth.records[projectId];
      if(!url) return null;
      const res = await fetch(url);
      return res.ok ? res.json() : null;
    }
    const raw = localStorage.getItem(REC_PREFIX + projectId);
    return raw ? JSON.parse(raw) : null;
  },
  // Onboarding: resolve an invite token → { projectId, clientCode? }.
  async resolveInvite(token){
    if(HUB_CONFIG.mode === 'live'){
      return hubFetch('/hub/auth', { method:'POST', body: JSON.stringify({ invite: token }) });
    }
    const p = loadProjects().find(x => x.inviteToken === token);
    return p ? { projectId:p.id, clientCode:p.clientCode } : null;
  },
  // ADMIN: register a file already sitting on the NAS deliverables share, get back
  // a stable /hub/files/<token> URL. `downloadable` picks Content-Disposition on
  // the server (attachment vs inline) — same file can be registered under both.
  // NAS-only feature; no SIMULATE equivalent (there's no NAS to register against).
  async deliverableUrl(path, downloadable){
    if(HUB_CONFIG.mode !== 'live') throw new Error('NAS deliverable links require live mode');
    return hubFetch('/hub/deliverable-url', { method:'POST', body: JSON.stringify({ path, downloadable: !!downloadable }) });
  },
  // ADMIN: register a whole NAS folder of images as a photo library, getting back one
  // {name, reviewUrl, downloadUrl} per image. Folder counterpart of deliverableUrl —
  // same live-only constraint (there is no NAS to enumerate in simulate mode).
  async deliverableFolder(path){
    if(HUB_CONFIG.mode !== 'live') throw new Error('NAS deliverable links require live mode');
    return hubFetch('/hub/deliverable-folder', { method:'POST', body: JSON.stringify({ path }) });
  },
  // CLIENT: persist the legal/audit evidence bundle alongside the signed agreement
  // (signer name, timestamp, signature image, consent text/checked, user-agent,
  // verification token). The server stamps the IP address from the request itself,
  // which is the one field a client-reported value could never be trusted for — so,
  // like deliverableUrl, this has no SIMULATE equivalent and is a live-only no-op.
  async submitAgreement(payload){
    if(HUB_CONFIG.mode !== 'live') return null;
    return hubFetch('/hub/agreement', { method:'POST', body: JSON.stringify(payload) });
  },
  // ADMIN: full legal-evidence bundle for a signed project (Slice 6 viewer).
  // No SIMULATE equivalent — the evidence itself is live-only (see submitAgreement).
  async fetchAgreement(projectId){
    if(HUB_CONFIG.mode !== 'live') return null;
    return hubFetch('/hub/agreement/' + encodeURIComponent(projectId));
  }
};

function loadProjects(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    // Don't silently wipe: back the bad blob up so a future save can't overwrite good data.
    try{ localStorage.setItem(STORAGE_KEY + '_corrupt_' + Date.now(), raw); }catch(_){}
    console.error('Client Hub: projects store was corrupt — kept a backup, starting empty.', e);
    return [];
  }
  if(!Array.isArray(parsed)) return [];
  // Normalise legacy/partial records so missing fields can't crash the tracker.
  return parsed.map(p => {
    // photos[] post-dates the first photo-library assets, so default it for stored projects.
    const assets = (Array.isArray(p.assets) ? p.assets : [])
      // `gated` post-dates existing projects: absent means gated, so stored deliverables
      // stay locked rather than becoming downloadable the moment this ships.
      .map(a => ({ ...a, photos: Array.isArray(a.photos) ? a.photos : [], gated: a.gated !== false }));
    let invoices = Array.isArray(p.invoices) ? p.invoices : [];
    // Migrate legacy single invoiceName → invoices[] final entry. Never wipe unknown fields.
    if(!invoices.length && p.invoiceName){
      invoices = [{ id: uid(), type:'final', name: p.invoiceName, url:'' }];
    }
    const agreement = (p.agreement && typeof p.agreement === 'object')
      ? { accepted: !!p.agreement.accepted, signedAt: p.agreement.signedAt || null,
          signerName: p.agreement.signerName || null, signatureDataUrl: p.agreement.signatureDataUrl || null }
      : { accepted: false, signedAt: null, signerName: null, signatureDataUrl: null };
    return { ...p, assets, invoices, agreement };
  });
}
function saveProjects(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }
  catch(e){
    console.error('Client Hub: save failed (storage may be full).', e);
    toast('⚠ Save failed — storage may be full. Copy your work before retrying.');
    return false;
  }
}

function assetStatusOf(asset){ return asset.status; } // 'reviewing' | 'changes' | 'approved'
function projectStatusOf(project){
  const assets = project.assets || [];
  if(!assets.length) return 'reviewing';
  if(assets.some(a => a.status === 'changes')) return 'changes';
  if(assets.every(a => a.status === 'approved')) return 'approved';
  return 'reviewing';
}
const statusMeta = {
  // dot is a CSS circle, not an emoji — it picks up each badge's own colour.
  reviewing:{ label:'Reviewing', dot:'<span class="status-dot"></span>', cls:'badge-reviewing' },
  changes:{ label:'Changes Requested', dot:'<span class="status-dot"></span>', cls:'badge-changes' },
  approved:{ label:'Approved & Closed', dot:'<span class="status-dot"></span>', cls:'badge-approved' },
};

// Hairline line-art icon set — replaces the emoji that used to stand in for media
// types. currentColor + stroke-based so they inherit text colour and stay crisp at
// any size, and they render identically across platforms (emoji don't).
const ICONS = {
  video: '<path d="M2 5.5h20v13H2z"/><path d="M7 5.5v13M17 5.5v13M2 12h20"/><path d="M2 8.75h5M2 15.25h5M17 8.75h5M17 15.25h5"/>',
  photo: '<path d="M3 5h18v14H3z"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 16.5l4.5-4.5 4 4 3-3L21 16"/>',
  doc:   '<path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><path d="M9 12h6M9 15.5h6M9 8.5h2"/>',
  play:  '<path d="M8 5.5l10 6.5-10 6.5z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.6"/>',
  download: '<path d="M12 3.5v12M7.5 11l4.5 4.5 4.5-4.5"/><path d="M4 19.5h16"/>',
  chevronLeft: '<path d="M15 4.5L7.5 12l7.5 7.5"/>',
  chevronRight: '<path d="M9 4.5l7.5 7.5L9 19.5"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  comment: '<path d="M4 4.5h16v11H9.5L5.5 19v-3.5H4z"/>',
  lock: '<path d="M5.5 10.5h13v9h-13z"/><path d="M8.5 10.5V7a3.5 3.5 0 017 0v3.5"/>',
};
// size = px. Stroke-only by default; `play` is the one solid glyph.
function icon(name, size = 20, cls = ''){
  const body = ICONS[name] || '';
  const fill = name === 'play' ? 'currentColor' : 'none';
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
}

// Smart admin-driven badges (F4). `[Project Complete]` is terminal and overrides the rest.
function smartBadges(p){
  const invoices = Array.isArray(p.invoices) ? p.invoices : [];
  const assets   = Array.isArray(p.assets)   ? p.assets   : [];
  const complete = p.delivered === true || (assets.length > 0 && assets.every(a => a.status === 'approved'));
  if(complete) return [{ label:'Project Complete', cls:'badge-complete' }];
  const out = [];
  if(invoices.some(i => i.type === 'deposit'))     out.push({ label:'Deposit Paid',    cls:'badge-deposit' });
  // A photo library is reviewable once its photos[] is populated — it has no single
  // reviewLink of its own, so checking reviewLink alone would never flag a photo-only
  // project as ready.
  const reviewable = a => a.type === 'photo'
    ? (a.photos || []).some(ph => isValidUrl(ph.reviewLink))
    : isValidUrl(a.reviewLink);
  if(assets.some(reviewable))                      out.push({ label:'Ready to Review', cls:'badge-ready'   });
  return out;
}

async function openEvidenceModal(projectId){

    const ev = await hubApi.fetchAgreement(projectId);
    setState({ evidenceLoading:false, evidenceResult: ev || { error:'No evidence on file for this project.' } });
  }catch(e){
    // 404 is an expected empty state (never signed against this backend, or a stale
    // local project pointing at a different DB) — not a real failure, no console noise.
    if(e && e.status === 404){

/* ---------------- guard: pick which door by URL param ----------------
   ?admin=1        → admin PIN → workspace
   ?invite=<token> → client onboarding (login shell for now; token resolves in Sprint C)
   ?project=<id>   → legacy public client link (kept)
   (no param)      → client login (default door — the top-nav CLIENT HUB link) */
(function guard(){
  const params = new URLSearchParams(location.search);
  if(params.get('logout') === '1'){ sessionStorage.removeItem(AUTH_KEY); state.authed = false; }

  const pid    = params.get('project');
  const invite = params.get('invite');
  const isAdmin= params.get('admin') === '1';

  if(pid){
    // Public client entry — bypasses the admin PIN and opens straight into the portal.
    // NOTE (live build): reads the project from this browser's localStorage. A real client
    // on another device won't have it — swap getViewProject() for a fetch of a published
    // record (Bunny Storage JSON / edge KV) before leaving simulate mode.
    state.clientMode = true;
    state.viewProjectId = pid;
    state.screen = 'client';
    state.clientScreen = 'landing';
    return;
  }
  if(invite){
    // Onboarding: Sprint C resolves the token → project + reveals/confirms the code.
    // For Sprint A this lands on the client-login shell with invite copy.
    state.entry = 'invite';
    state.inviteToken = invite;
    return;
  }
  if(isAdmin){
    // Admin door → PIN (render() gates on state.authed).
    state.entry = 'admin';
    return;
  }
  // Default door → client login shell.
  state.entry = 'client';
})();

async function submitPin(){
  if(state.pinError || state.pinChecking) return;
  if(state.pinInput.length !== 4) return;

  state.pinChecking = true; state.adminLoginMsg = null; render();
  const email = (state.adminEmailInput||'').trim();
  const pin = state.pinInput;
  try {
    await hubFetch('/hub/admin-auth', { method:'POST', body: JSON.stringify({ email, pin }) });
    sessionStorage.setItem(AUTH_KEY, 'true');
    state.authed = true; state.pinChecking = false; state.pinInput=''; state.screen='tracker';
    render();
  } catch(e){
    console.error('admin-auth failed:', e);
    if(e && e.status === 401){
      state.pinChecking = false; state.pinError = true;
      render();
      const pinEl = document.getElementById('pin-input');
      if(pinEl) pinEl.classList.add('shake');
      setTimeout(() => { state.pinError=false; state.pinInput=''; render();

    } else {
      // No response at all (network/NAS down) — don't imply "wrong PIN" with a shake.
      state.pinChecking = false; state.pinInput = '';
      state.adminLoginMsg = "Can't reach the server — check your connection.";
      render();
    }
  }

function failClientLogin(msg){
  state.clientLoginError = true; render();
  const el = document.getElementById('client-code-input'); if(el) el.classList.add('shake');
  setTimeout(() => {
    setState({ clientLoginError:false, clientCodeInput:'', clientLoginMsg: msg });
    const codeEl = document.getElementById('client-code-input'); if(codeEl) codeEl.focus();
  }, 500);
}

async function submitClientLogin(){
  // Real email + 4-digit-code verification. SIMULATE compares SHA-256 against the private
  // auth records in localStorage; LIVE POSTs to /hub/auth. On success we fetch the published
  // record (pull zone in live) and drop into the portal — this is the cross-device path.
  const email = (state.clientLoginEmail || '').trim();
  const code  = state.clientCodeInput;
  if(!email || !/.+@.+\..+/.test(email)){
    return failClientLogin('Enter a valid email above, then your 4-digit code.');
  }
  state.clientLoginMsg = 'Checking…'; render();
  try {
    const auth = await hubApi.authClient(email, code);
    if(!auth || !auth.token || !auth.projectIds || !auth.projectIds.length){
      return failClientLogin('That email and code didn’t match. Check your invitation and try again.');
    }
    sessionStorage.setItem(CLIENT_TOKEN_SS, auth.token);
    const pid = auth.projectIds[0]; // (multi-project selector = future work)
    const record = await hubApi.fetchRecord(pid, auth);
    if(!record){ return failClientLogin('Your delivery couldn’t be loaded. Please contact the studio.'); }
    state.clientRecord = record;
    setState({ clientMode:true, viewProjectId:pid, screen:'client', clientScreen:'landing',
      clientCodeInput:'', clientLoginError:false, clientLoginMsg:null, inviteHint:null });
  } catch(e){
    console.error('client auth failed:', e);
    failClientLogin('Sign-in failed (network). Please try again.');
  }
}

async function clientForgotCode(){
  const email = (state.clientLoginEmail || '').trim();
  if(!email){ return setState({ clientLoginMsg:'Enter your email above first, then tap “Forgot your code?”.' }); }
  // Privacy: never reveal whether the email is on file.
  try {
    if(HUB_CONFIG.mode === 'live'){
      await hubFetch('/hub/notify', { method:'POST', body: JSON.stringify({ kind:'reset', email }) });
    } else {
      const p = loadProjects().find(x => (x.clientEmail||'').toLowerCase() === email.toLowerCase());
      if(p && p.inviteToken) await emailService.sendCodeReset(p, HUB_CONFIG);
    }
  } catch(e){ console.error(e); }
  setState({ clientLoginMsg:'If that email is on file, a reset code has been sent. Check your inbox.' });
}

function bindClientLogin(){
  const emailEl = document.getElementById('client-login-email');
  if(emailEl) emailEl.addEventListener('input', () => { state.clientLoginEmail = emailEl.value; });
  const codeEl = document.getElementById('client-code-input');
  if(codeEl){
    codeEl.addEventListener('input', () => {
      state.clientCodeInput = codeEl.value.replace(/\D/g,'').slice(0,4);
      codeEl.value = state.clientCodeInput; // reflect stripped/capped value without a render()
      if(state.clientCodeInput.length === 4) submitClientLogin();
    });
    codeEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && state.clientCodeInput.length === 4) submitClientLogin();
    });
  }
  const forgot = document.getElementById('client-forgot');
  if(forgot) forgot.onclick = clientForgotCode;
  const adminLink = document.getElementById('client-admin-link');
  if(adminLink) adminLink.onclick = () => { state.entry = 'admin'; render(); };

  // Invite onboarding: resolve the ?invite= token once to prefill email + reveal the code.
  if(state.entry === 'invite' && state.inviteToken && !state.inviteHint){
    state.inviteHint = {}; // sentinel guards against re-resolving on every re-render
    hubApi.resolveInvite(state.inviteToken).then(res => {
      if(!res || !res.projectId){ return; }        // leave the {} sentinel; no code hint shown
      state.inviteHint = { code: res.clientCode || '', projectId: res.projectId };
      // Mark active (simulate, same-device). Live: the edge sets clientStatus server-side.
      if(HUB_CONFIG.mode !== 'live'){
        const proj = state.projects.find(x => x.id === res.projectId);
        if(proj){
          if(proj.clientStatus !== 'active'){ proj.clientStatus = 'active'; saveProjects(state.projects); }
          if(!state.clientLoginEmail && proj.clientEmail) state.clientLoginEmail = proj.clientEmail;
        }
      }
      render();
    }).catch(e => console.error('invite resolve failed:', e));
  }
}

function newAsset(type){
  // photos[] is the photo-library payload ({name, reviewLink, downloadLink} per image,
  // filled by NAS LINK from a folder). Video assets leave it empty and use
  // reviewLink/downloadLink instead; photo assets are the mirror image.
  // gated:true by default — a deliverable stays locked until the agreement is signed
  // unless the admin deliberately opens it. Defaulting the other way would silently

  return { id: uid(), type, title:'', reviewLink:'', downloadLink:'', driveLink:'', deliverablePath:'', photos:[], gated:true, status:'reviewing', comments:[] };

// Absolute NAS host path the admin copies out of the UGREEN file manager — matches
// docker-compose.yml's deliverables volume source exactly. Anything under it converts
// to the backend's expected relative path; a `/`-prefixed path that doesn't match is a
// different volume/share/app and must fail loudly rather than register the wrong file.
const NAS_PATH_PREFIX = '/volume4/LSC Creative_Media/Client Deliverables_Media';
function toRelativeDeliverablePath(raw){
  if(raw.startsWith(NAS_PATH_PREFIX)) return raw.slice(NAS_PATH_PREFIX.length).replace(/^\/+/, '');
  if(raw.startsWith('/')) return null;
  return raw;
}

// Media preview for a deliverable card on the client landing.
//   video — the real file with #t=1, which makes the browser fetch just enough via
//           Range to decode and paint the frame at 1s as a still poster. muted +
//           preload="metadata" keeps it cheap; it never plays here.
//   photo — up to the first three images as a filmstrip.
// The icon fallback sits underneath the media, so a broken or slow thumbnail shows
// the icon rather than an empty box. Purely decorative: the card's own label carries
// the meaning, so the media is aria-hidden.
function renderAssetThumb(a){
  const fallback = `<span class="thumb-fallback">${icon(a.type === 'video' ? 'video' : 'photo', 34)}</span>`;

  if(a.type === 'photo'){
    const shots = (a.photos || []).filter(ph => ph.reviewLink).slice(0, 3);
    if(!shots.length) return `<div class="asset-thumb">${fallback}</div>`;
    return `
      <div class="asset-thumb is-strip" aria-hidden="true">
        ${fallback}
        ${shots.map(ph => `<img src="${escapeAttr(ph.reviewLink)}" alt="" loading="lazy">`).join('')}
      </div>`;
  }

  if(!a.reviewLink || !isValidUrl(a.reviewLink)) return `<div class="asset-thumb">${fallback}</div>`;
  return `
    <div class="asset-thumb" aria-hidden="true">
      ${fallback}
      <video src="${escapeAttr(a.reviewLink)}#t=1" preload="metadata" muted playsinline
             disablePictureInPicture oncontextmenu="return false"
             onerror="this.remove()"></video>
    </div>`;
}

      <div class="space-y-2 max-w-xl">${rows.join('')}</div>

}

      <div class="mono text-[10px] text-[var(--lsc-mid)] mb-2">ACTIVITY LOG</div>
      <div class="space-y-2">
        ${a.comments.map(c => `
          <div class="card rounded-lg p-3 text-sm">
            ${c.timestamp ? `<span class="mono text-[10px] text-[var(--lsc-terra)] mr-2 inline-flex items-center gap-1 align-middle">${icon('clock', 12)}${c.timestamp}</span>` : ''}
            ${c.photoIdx != null ? `<span class="mono text-[10px] text-[var(--lsc-sage)] mr-2">${c.photoName ? escapeHtml(c.photoName) : 'PHOTO #' + (c.photoIdx+1)}</span>` : ''}
            <span>${escapeHtml(c.text)}</span>
            <div class="mono text-[9px] text-[var(--lsc-mid)] mt-1">${c.at}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  // Quiet utility link under the primary action — deliberately low-contrast and small so
  // it never competes with APPROVE CONTENT. A gated deliverable shows the lock reason
  // instead of a live link until the agreement is signed.
  const p = getViewProject();
  const unlocked = downloadUnlocked(p, a);
  const hasFile = a.type === 'photo'
    ? (a.photos || []).some(ph => ph.downloadLink && isValidUrl(ph.downloadLink))
    : (a.downloadLink && isValidUrl(a.downloadLink));
  const downloadLink = `
    <div class="mt-3">
      ${!unlocked
        ? `<span class="mono text-[10px] text-[var(--lsc-mid)] inline-flex items-center gap-1.5" title="This deliverable unlocks once you've signed the agreement.">${icon('lock', 12)}Download · unlocks after sign-off</span>`
        : !hasFile
          ? `<span class="mono text-[10px] text-[var(--lsc-mid)] opacity-40 inline-flex items-center gap-1.5">${icon('download', 12)}Download</span>`
          : a.type === 'photo'
            // A library has no single file — each photo carries its own download inside
            // its full view, which is also where the client is actually judging it.
            ? `<span class="mono text-[10px] text-[var(--lsc-mid)] inline-flex items-center gap-1.5">${icon('download', 12)}Open a photo to download it</span>`
            : `<a href="${escapeAttr(a.downloadLink)}" target="_blank" rel="noopener" download class="mono text-[10px] text-[var(--lsc-mid)] hover:text-[var(--lsc-white)] underline underline-offset-4 inline-flex items-center gap-1.5">${icon('download', 12)}Download</a>`}
    </div>`;

  // Photo libraries have NO asset-level revision panel — feedback is per photo, inside
  // the lightbox, so the only decision left at this level is approval.
  if(a.type === 'photo'){
    return `
      <div class="mt-6">
        <button id="approve-asset" class="btn-terra rounded-lg px-7 py-3.5 mono text-base tracking-wide">APPROVE CONTENT</button>
        ${downloadLink}
      </div>
      ${commentLog}
    `;
  }

  // While the revision panel is open the approve button is absent from the DOM entirely,
  // not just disabled — a client asking for changes is not approving this content.
  return `
    <div class="mt-6">
      <div class="flex flex-wrap items-center gap-3">
        <button id="want-revisions" class="btn-sage rounded-lg px-5 py-3 mono text-xs">${state.revisionOpen ? 'REVISION FORM OPEN' : 'COMMENT REVISIONS'}</button>
        ${state.revisionOpen ? '' : `<button id="approve-asset" class="btn-terra rounded-lg px-7 py-3.5 mono text-base tracking-wide">APPROVE CONTENT</button>`}
      </div>
      ${downloadLink}

    ${commentLog}
  `;
}

// client has signed the agreement; an ungated one is available throughout review.
// The final-delivery screen sits behind the signed agreement anyway, so gated assets

function downloadUnlocked(p, a){
  if(a.gated === false) return true;

// Stable key for a photo's draft + comments. Filename over index: adding a file to the
// NAS folder reshuffles indices, and a draft silently reattaching to a different image
// is the failure this whole per-photo model exists to prevent.

  const ph = (a.photos || [])[i];
  return (ph && ph.name) ? `${a.id}::${ph.name}` : `${a.id}::idx${i}`;

              ${SIGNATURE_FONTS.map(f => `<option value="${escapeAttr(f.family)}" ${state.agreementFont === f.family ? 'selected' : ''}>${escapeHtml(f.label)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="bg-[var(--lsc-surface)] rounded-lg w-full flex items-center justify-center px-4" style="min-height:120px;">
          <div id="signature-preview" style="font-family:${escapeAttr(state.agreementFont)}; font-size:2.75rem; line-height:1; color:var(--lsc-white); word-break:break-word; text-align:center;">${escapeHtml(state.agreementSignerName || '')}</div>
        </div>

// Cursive font options for the typed signature generator (loaded via Google Fonts in <head>).
const SIGNATURE_FONTS = [
  { label:'Dancing Script', family:"'Dancing Script', cursive" },
  { label:'Great Vibes',    family:"'Great Vibes', cursive" },
  { label:'Alex Brush',     family:"'Alex Brush', cursive" },
  { label:'Sacramento',     family:"'Sacramento', cursive" },
  { label:'Caveat',         family:"'Caveat', cursive" },
];

// Draws the typed name onto a hidden canvas in the chosen cursive font and returns a PNG
// data URL — white background + dark ink, independent of the on-screen dark theme, since
// this is the persisted signature image rather than a UI element.
async function rasterizeSignature(name, fontFamily){
  const canvas = document.createElement('canvas');
  canvas.width = 700; canvas.height = 180;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#111111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let size = 72;
  const maxWidth = canvas.width - 60;
  try { await document.fonts.load(`${size}px ${fontFamily}`, name); } catch(e){ /* font may already be loaded/cached */ }
  ctx.font = `${size}px ${fontFamily}`;
  while(size > 24 && ctx.measureText(name).width > maxWidth){
    size -= 4;
    ctx.font = `${size}px ${fontFamily}`;
  }
  ctx.fillText(name, canvas.width / 2, canvas.height / 2);
  return canvas.toDataURL('image/png');
}

function bindAgreementScreen(){
  bindClientChrome();
  const nameEl = document.getElementById('agreement-signer-name');
  const preview = document.getElementById('signature-preview');
  const statusEl = document.getElementById('signature-status');
  const consentEl = document.getElementById('agreement-consent');
  const confirmBtn = document.getElementById('confirm-agreement');
  const updateSignature = () => {
    const name = (state.agreementSignerName || '').trim();
    state.signature = !!name;
    if(preview) preview.textContent = state.agreementSignerName || '';
    if(statusEl) statusEl.textContent = state.signature ? '✓ signature captured' : 'type your name above to sign';
    updateConfirmEnabled();
  };
  const updateConfirmEnabled = () => {
    if(!confirmBtn) return;
    const ready = state.signature && state.agreementConsent;
    confirmBtn.disabled = !ready;
    confirmBtn.style.opacity = ready ? '' : '.4';
    confirmBtn.style.cursor = ready ? '' : 'not-allowed';
  };
  if(nameEl) nameEl.addEventListener('input', () => { state.agreementSignerName = nameEl.value; updateSignature(); });

  const fontSelect = document.getElementById('agreement-font-select');
  if(fontSelect) fontSelect.addEventListener('change', () => {
    state.agreementFont = fontSelect.value;
    if(preview) preview.style.fontFamily = fontSelect.value;
  });

  if(consentEl) consentEl.addEventListener('change', () => { state.agreementConsent = consentEl.checked; updateConfirmEnabled(); });

  if(confirmBtn) confirmBtn.onclick = async () => {
    const name = (state.agreementSignerName || '').trim();
    if(!name || !state.agreementConsent) return;
    confirmBtn.disabled = true;
    const signatureDataUrl = await rasterizeSignature(name, state.agreementFont);
    const p = getViewProject();
    const signedAt = new Date().toISOString();
    p.agreement = { accepted:true, signedAt, signerName: name, signatureDataUrl };
    persistViewProject();
    try {
      await hubApi.submitAgreement({
        projectId: p.id,
        signerName: name,
        signedAt,
        signatureDataUrl,
        consentText: AGREEMENT_CONSENT_TEXT,
        consentChecked: state.agreementConsent,
        userAgent: navigator.userAgent,
        verificationToken: sessionStorage.getItem(CLIENT_TOKEN_SS) || '',
      });
    } catch(e){
      // Best-effort from the client's side: they've already signed and their own
      // record shows it — don't block access to the deliverables over a network
      // hiccup on the legal-evidence write. Admin-side follow-up if this happens.
      console.error('submitAgreement failed:', e);
    }
    setState({ clientScreen:'final' });
  };
}

/* ================= helpers ================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function toast(msg){
  // Lightweight DOM toast — deliberately not part of render() so it survives re-renders.
  const t = document.createElement('div');
  t.className = 'toast fixed top-4 left-1/2 -translate-x-1/2 z-50 card rounded-lg px-4 py-2 mono text-xs';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ================= RENDER ROOT ================= */
function render(){
  const root = document.getElementById('app');
  if(state.clientMode){
    // Public client entry point (?project=) — never shows the admin PIN or tracker.
    if(!getViewProject()){ root.innerHTML = renderClientNotFound(); return; }
    if(state.clientScreen === 'asset'){ root.innerHTML = renderClientAsset(); bindClientAsset(); return; }
    if(state.clientScreen === 'final'){ root.innerHTML = renderClientFinal(); bindClientFinal(); return; }
    if(state.clientScreen === 'agreement'){ root.innerHTML = renderAgreementScreen(); bindAgreementScreen(); return; }
    root.innerHTML = renderClientLanding(); bindClientLanding(); return;
  }
  // Client door (default) + invite onboarding → client login shell. The admin PIN
  // is reachable ONLY via the ?admin=1 door, never from a client session.
  if(state.entry === 'client' || state.entry === 'invite'){
    root.innerHTML = renderClientLogin(); bindClientLogin(); return;
  }
  if(!state.authed){ root.innerHTML = renderLock(); bindLock(); return; }
  if(state.screen === 'tracker'){ root.innerHTML = renderTracker(); bindTracker(); return; }
  if(state.screen === 'editor'){ root.innerHTML = renderEditor(); bindEditor(); return; }
  if(state.screen === 'client'){
    if(state.clientScreen === 'landing'){ root.innerHTML = renderClientLanding(); bindClientLanding(); return; }
    if(state.clientScreen === 'asset'){ root.innerHTML = renderClientAsset(); bindClientAsset(); return; }
    if(state.clientScreen === 'final'){ root.innerHTML = renderClientFinal(); bindClientFinal(); return; }
    if(state.clientScreen === 'agreement'){ root.innerHTML = renderAgreementScreen(); bindAgreementScreen(); return; }
  }
}

/* ================= BINDINGS ================= */
function bindLock(){
  const emailEl = document.getElementById('admin-login-email');
  if(emailEl) emailEl.addEventListener('input', () => { state.adminEmailInput = emailEl.value; });
  const pinEl = document.getElementById('pin-input');
  if(pinEl){
    pinEl.addEventListener('input', () => {
      state.pinInput = pinEl.value.replace(/\D/g,'').slice(0,4);
      pinEl.value = state.pinInput; // reflect stripped/capped value without a render()
      if(state.pinInput.length === 4) submitPin();
    });
    pinEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && state.pinInput.length === 4) submitPin();
    });
  }
}

/* ---- Sprint C admin actions ---- */
async function inviteClient(projectId){
  const p = state.projects.find(x => x.id === projectId);
  if(!p){ return; }
  if(!(p.clientEmail||'').trim()){ setState({ menuOpenId:null }); toast('Add a client email in Edit Project first.'); return; }
  // Snapshot so a failed publish never leaves a code the client was never actually sent.
  const prev = { code:p.clientCode, token:p.inviteToken, status:p.clientStatus, publishedAt:p.publishedAt };
  p.clientCode   = gen4();
  p.inviteToken  = p.inviteToken || genToken();
  p.clientStatus = 'invited';
  let payload;
  try {
    await hubApi.publish(p);
    payload = await emailService.sendInvitation(p, HUB_CONFIG);
  } catch(e){
    p.clientCode = prev.code; p.inviteToken = prev.token;
    p.clientStatus = prev.status; p.publishedAt = prev.publishedAt;
    setState({ menuOpenId:null });
    reportAdminError(e, 'Invite');
    return;                                  // no "Client invited" modal on a failed publish
  }
  saveProjects(state.projects);
  setState({ menuOpenId:null, inviteResult: { name:p.name, to:p.clientEmail, url:payload.url, code:p.clientCode } });
}

async function publishProject(projectId){
  const p = state.projects.find(x => x.id === projectId);
  if(!p){ return; }
  try { await hubApi.publish(p); saveProjects(state.projects); toast('Published to client.'); }
  catch(e){ reportAdminError(e, 'Publish'); }
  setState({ menuOpenId:null });
}

async function toggleDelivered(projectId){
  const p = state.projects.find(x => x.id === projectId);
  if(!p){ return; }
  p.delivered = !p.delivered;               // drives [Project Complete] + un-gates the final invoice
  if(p.publishedAt){
    try { await hubApi.publish(p); }
    catch(e){
      p.delivered = !p.delivered;           // roll back: the client's record still says otherwise
      setState({ menuOpenId:null });
      reportAdminError(e, 'Delivery update');
      return;
    }
  }
  saveProjects(state.projects);
  setState({ menuOpenId:null });
  toast(p.delivered ? 'Marked delivered — final invoice unlocked for the client.' : 'Marked undelivered.');
}

async function masterReset(projectId){
  const p = state.projects.find(x => x.id === projectId);
  if(!p){ return setState({ confirmResetId:null }); }
  // Snapshot: a failed publish must not invalidate the client's working code locally.
  const prev = { code:p.clientCode, token:p.inviteToken, status:p.clientStatus, publishedAt:p.publishedAt };
  p.clientCode = gen4();
  p.inviteToken = p.inviteToken || genToken();
  if(!p.clientStatus) p.clientStatus = 'invited';
  let payload;
  try { await hubApi.publish(p); payload = await emailService.sendCodeReset(p, HUB_CONFIG); }
  catch(e){
    p.clientCode = prev.code; p.inviteToken = prev.token;
    p.clientStatus = prev.status; p.publishedAt = prev.publishedAt;
    setState({ confirmResetId:null, menuOpenId:null });
    reportAdminError(e, 'Code reset');
    return;
  }
  saveProjects(state.projects);
  setState({ confirmResetId:null, menuOpenId:null, inviteResult: { name:p.name, to:p.clientEmail, url:payload.url, code:p.clientCode, reset:true } });
}

function bindEditor(){
  document.getElementById('back-tracker').onclick = document.getElementById('cancel-project').onclick =
    () => setState({ screen:'tracker', draft:null, editingId:null, editorError:null, nasLinkHelpOpen:false });

  document.querySelectorAll('[data-field]:not([data-asset])').forEach(el => {
    el.addEventListener('input', () => { state.draft[el.dataset.field] = el.value; });
  });
  document.querySelectorAll('[data-field][data-asset]').forEach(el => {
    el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', () => {
      const asset = state.draft.assets.find(a => a.id === el.dataset.asset);
      asset[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value;
    });
  });
  document.querySelectorAll('[data-invoice-input]').forEach(inp => {
    inp.addEventListener('change', () => {
      if(!inp.files[0]) return;
      const type = inp.dataset.invoiceInput;
      // SIMULATE: store the filename only. LIVE (Sprint B live): POST the file to
      // HUB_CONFIG.edgeBase + '/hub/upload' (admin bearer) → returns a pull-zone URL under
      // clienthubdata/invoices/<projectId>/<file>; store that as the invoice url.
      setInvoice(state.draft, type, inp.files[0].name, '');
      render();
    });
  });
  document.querySelectorAll('[data-invoice-remove]').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      const type = btn.dataset.invoiceRemove;
      state.draft.invoices = (state.draft.invoices || []).filter(i => i.type !== type);
      render();
    };
  });

  document.querySelectorAll('[data-gen-link]').forEach(btn => {
    btn.onclick = async () => {
      const asset = state.draft.assets.find(a => a.id === btn.dataset.asset);
      const raw = (asset.deliverablePath || '').trim();
      if(!raw) return;
      const relativePath = toRelativeDeliverablePath(raw);
      if(relativePath === null){
        toast(`⚠ Path must be inside ${NAS_PATH_PREFIX} — check you copied the right folder.`);
        return;
      }
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = '…';
      try {
        if(asset.type === 'photo'){
          // A photo library is a FOLDER: one call enumerates it and returns a URL pair
          // per image. asset.reviewLink/downloadLink stay empty for photo assets —
          // photos[] is what the client grid and the final screen read.
          const { photos } = await hubApi.deliverableFolder(relativePath);
          asset.photos = (photos || []).map(ph => ({ name: ph.name, reviewLink: ph.reviewUrl, downloadLink: ph.downloadUrl }));
          asset.deliverablePath = relativePath;
          toast(`✓ Linked ${asset.photos.length} photo${asset.photos.length===1?'':'s'}.`);
        } else {
          const [review, download] = await Promise.all([
            hubApi.deliverableUrl(relativePath, false),
            hubApi.deliverableUrl(relativePath, true)
          ]);
          asset.reviewLink = review.url;
          asset.downloadLink = download.url;
          asset.deliverablePath = relativePath;
        }
        render();
      } catch(e){
        btn.disabled = false; btn.textContent = original;
        reportAdminError(e, 'Generate NAS link');
      }
    };
  });

  document.getElementById('add-video').onclick = () => { state.draft.assets.push(newAsset('video')); render(); };
  document.getElementById('add-photo').onclick = () => { state.draft.assets.push(newAsset('photo')); render(); };
  document.querySelectorAll('[data-remove-asset]').forEach(btn => {
    btn.onclick = () => { state.draft.assets = state.draft.assets.filter(a => a.id !== btn.dataset.removeAsset); render(); };
  });

  document.getElementById('save-project').onclick = () => {
    const d = state.draft;
    if(!d.name.trim()){ setState({ editorError: 'Project Name is required.' }); return; }
    const badLink = d.assets.some(a => (a.reviewLink && !isValidUrl(a.reviewLink)) || (a.downloadLink && !isValidUrl(a.downloadLink)) || (a.driveLink && !isValidUrl(a.driveLink)));
    if(badLink){ setState({ editorError: 'All links must start with https:// — check highlighted fields.' }); return; }
    let list = state.projects;
    if(state.editingId){ list = list.map(p => p.id === state.editingId ? d : p); }
    else { list = [d, ...list]; }
    if(!saveProjects(list)){ setState({ editorError: 'Save failed — storage may be full. Copy your work before retrying.' }); return; }
    setState({ projects:list, screen:'tracker', draft:null, editingId:null, editorError:null });
  };

  document.querySelectorAll('[data-view-evidence]').forEach(btn => {
    btn.onclick = () => openEvidenceModal(btn.dataset.viewEvidence);
  });
  const closeEvidence = document.getElementById('close-evidence');
  if(closeEvidence) closeEvidence.onclick = () => setState({ evidenceProjectId:null, evidenceResult:null });

  const nasLinkHelp = document.getElementById('nas-link-help');
  if(nasLinkHelp) nasLinkHelp.onclick = () => setState({ nasLinkHelpOpen:true });
  const closeNasLinkHelp = document.getElementById('close-nas-link-help');
  if(closeNasLinkHelp) closeNasLinkHelp.onclick = () => setState({ nasLinkHelpOpen:false });
}

function bindClientAsset(){
  bindClientChrome();
  document.querySelectorAll('[data-switch-asset]').forEach(btn => {
    btn.onclick = () => setState({ activeAssetId: btn.dataset.switchAsset, revisionOpen:false, selectedPhotoIdx:null, lightboxIdx:null, pausedAt:null, videoFailed:false, approveModalAssetId:null });
  });

  const p = getViewProject();
  const a = p.assets.find(x => x.id === state.activeAssetId);

  const video = document.getElementById('asset-video');
  if(video){
    // Drive the pill through setPausePill (no render()) — a full re-render would replace
    // the <video> element wholesale via root.innerHTML and restart playback from 0.
    video.onerror = () => setState({ videoFailed:true });
    video.onplay = () => setPausePill(null);
    video.onpause = () => {
      if(video.ended) return;
      // Timestamps only exist once the client has actually asked for revisions — an
      // incidental pause while just watching must not stamp anything.
      if(!state.revisionOpen) return;
      setPausePill(fmtVideoTime(video.currentTime));
    };
  }

  document.querySelectorAll('[data-photo]').forEach(el => {
    el.onclick = () => openLightbox(Number(el.dataset.photo));
  });

  if(confirmApprove) confirmApprove.onclick = () => {

    persistViewProject();

    setState({ clientScreen: nextScreen, revisionOpen:false, approveModalAssetId:null });
  };
  const cancelApprove = document.getElementById('cancel-approve');
  if(cancelApprove) cancelApprove.onclick = () => setState({ approveModalAssetId:null });

  bindAssetInteraction(a, p);
}

/* ---------------- photo lightbox ---------------- */
// Repaint ONLY #lightbox-host. A full render() would rebuild the whole asset screen and
// reload every thumbnail; this keeps navigation instant and the contact sheet untouched.
function refreshLightbox(){
  const host = document.getElementById('lightbox-host');
  if(!host) return;
  const p = getViewProject();
  const a = p && p.assets.find(x => x.id === state.activeAssetId);
  if(!a) return;
  host.innerHTML = a.type === 'photo' ? renderPhotoLightbox(a) : '';
  bindPhotoLightbox(a);
}

function openLightbox(i){
  state.lightboxIdx = i;
  state.selectedPhotoIdx = i;
  refreshLightbox();
  const box = document.getElementById('lb-text');
  if(box) box.focus();
}

function closeLightbox(){
  state.lightboxIdx = null;
  refreshLightbox();
  // The contact sheet's comment-count badges change as notes are added, so repaint it.
  refreshAssetInteraction();
  const canvasHost = document.getElementById('photo-canvas');
  if(canvasHost){
    const p = getViewProject();
    const a = p && p.assets.find(x => x.id === state.activeAssetId);
    if(a){ canvasHost.innerHTML = renderPhotoCanvas(a); bindPhotoThumbs(a); }
  }
}

// Step through the library. The draft for the photo being LEFT is already saved under its
// own key by the input handler, and the photo being entered reads its own key — so an
// untouched photo always opens with an empty box.
function stepLightbox(delta){
  const p = getViewProject();
  const a = p && p.assets.find(x => x.id === state.activeAssetId);
  if(!a) return;
  const photos = a.photos || [];
  const next = (state.lightboxIdx == null ? 0 : state.lightboxIdx) + delta;
  if(next < 0 || next >= photos.length) return;
  openLightbox(next);
}

function bindPhotoThumbs(a){
  document.querySelectorAll('[data-photo]').forEach(el => {
    el.onclick = () => openLightbox(Number(el.dataset.photo));
  });
}

function bindPhotoLightbox(a){
  const root = document.getElementById('photo-lightbox');
  if(!root) return;

  const prev = root.querySelector('[data-lb-prev]');
  if(prev) prev.onclick = () => stepLightbox(-1);
  const next = root.querySelector('[data-lb-next]');
  if(next) next.onclick = () => stepLightbox(1);
  const close = document.getElementById('lb-close');
  if(close) close.onclick = () => closeLightbox();

  const box = document.getElementById('lb-text');
  if(box){
    const key = photoDraftKey(a, state.lightboxIdx);
    // Save under THIS photo's key on every keystroke, so arrowing away and back restores
    // the right text and never bleeds it onto a neighbour.
    box.addEventListener('input', () => { state.photoDrafts[key] = box.value; });
  }

  const submit = document.getElementById('lb-submit');
  if(submit) submit.onclick = () => {
    const i = state.lightboxIdx;
    const key = photoDraftKey(a, i);
    const text = (state.photoDrafts[key] || '').trim();
    if(!text) return;
    const ph = (a.photos || [])[i] || {};
    a.comments.push({
      text,
      timestamp: null,
      photoIdx: i,
      photoName: ph.name || null,
      at: nowStr(),
    });
    a.status = 'changes';
    persistViewProject();
    delete state.photoDrafts[key];   // this photo only
    refreshLightbox();
    const again = document.getElementById('lb-text');
    if(again) again.focus();
  };
}

// Escape closes, arrows walk the library — but never while the client is typing a note.
document.addEventListener('keydown', (e) => {
  if(state.lightboxIdx == null) return;
  const typing = e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT');
  if(e.key === 'Escape'){ e.preventDefault(); closeLightbox(); return; }
  if(typing) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); stepLightbox(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); stepLightbox(1); }
});

// mm:ss for the review-timestamp pill.
function fmtVideoTime(seconds){
  const t = Math.max(0, Math.floor(seconds || 0));
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

// #pause-pill sits outside #asset-interaction (next to the player), so it's updated in
// place rather than re-rendered. Passing null clears the stamp and hides the pill.
function setPausePill(value){
  state.pausedAt = value || null;
  const pill = document.getElementById('pause-pill');
  if(!pill) return;
  // Only the time text is rewritten — the clock icon is static markup beside it.
  if(state.pausedAt){
    const label = document.getElementById('pause-pill-time');
    if(label) label.textContent = state.pausedAt;
    pill.style.display = '';
  }
  else { pill.style.display = 'none'; }
}

// Bindings for everything inside #asset-interaction. Called by bindClientAsset on a full
// render and again by refreshAssetInteraction after a partial repaint. These handlers use
// refreshAssetInteraction() — NOT setState() — so the <video> survives with its playhead
// intact. approve-asset is the exception: it opens a modal outside this container.
function bindAssetInteraction(a, p){
  const approveBtn = document.getElementById('approve-asset');
  if(approveBtn) approveBtn.onclick = () => setState({ approveModalAssetId: a.id });

  const wantRev = document.getElementById('want-revisions');
  if(wantRev) wantRev.onclick = () => {
    state.revisionOpen = !state.revisionOpen;
    const video = document.getElementById('asset-video');
    if(state.revisionOpen){
      // Opening the panel is what arms the timestamp. Stamp the live playhead only if the
      // client is actually parked on a frame — pause-on-the-problem-then-ask-for-revisions
      // is the normal flow, and a stamp taken mid-playback would be stale by the time they
      // finish typing.
      setPausePill(video && video.paused && video.currentTime > 0 ? fmtVideoTime(video.currentTime) : null);
    } else {
      setPausePill(null);
    }
    refreshAssetInteraction();
  };

  const revText = document.getElementById('revision-text');
  if(revText) revText.addEventListener('input', () => { state.revisionDraft = revText.value; });

  const submitRev = document.getElementById('submit-revision');
  if(submitRev) submitRev.onclick = () => {
    if(!state.revisionDraft.trim()) return;
    // Video assets only — photo notes are written per photo in the lightbox.
    a.comments.push({
      text: state.revisionDraft.trim(),
      timestamp: state.pausedAt || null,
      photoIdx: null,
      photoName: null,
      at: nowStr(),
    });
    a.status = 'changes';
    persistViewProject();
    // Panel stays OPEN with an empty box: a client usually has more than one note, and
    // the old setState({revisionOpen:false}) both collapsed the panel and restarted the
    // video. Only #asset-interaction repaints, so the playhead is untouched.
    state.revisionDraft = '';
    refreshAssetInteraction();
    const nextBox = document.getElementById('revision-text');
    if(nextBox) nextBox.focus();
  };

  const cancelRev = document.getElementById('cancel-revision');
  if(cancelRev) cancelRev.onclick = () => {
    if(a.comments.length) return;
    state.revisionOpen = false;
    state.revisionDraft = '';
    setPausePill(null);
    refreshAssetInteraction();
  };
}

function bindClientFinal(){
  bindClientChrome();
}

function persistViewProject(){
  const p = getViewProject();
  if(!p) return;
  // Real client on a fetched published record (not in state.projects).
  if(state.clientRecord && state.clientRecord.id === p.id){
    // SIMULATE: cache back to the local record store so a reload keeps their progress.
    // LIVE seam: client-authored approvals/revisions need a /hub/feedback write endpoint so
    // they reach the studio cross-device (follow-up — not in the Sprint C read-path gate).
    if(HUB_CONFIG.mode !== 'live'){ localStorage.setItem(REC_PREFIX + p.id, JSON.stringify(p)); }
    return;
  }
  const list = state.projects.map(x => x.id === p.id ? p : x);
  saveProjects(list);
  state.projects = list;
}

/* close context menu on outside click */
document.addEventListener('click', (e) => {
  if(state.menuOpenId && !e.target.closest('[data-menu]') && !e.target.closest(`[data-edit],[data-impersonate],[data-invite],[data-publish],[data-delivered],[data-copylink],[data-askreset],[data-askdelete]`)){
    state.menuOpenId = null; render();
  }
});

render();
