<title>Scope &amp; Sales</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The server writes this page's version here (server/src/web.js); js/update.js
     compares it with the one each /api reply carries. Empty when the page is
     served some other way, which switches the check off. -->
<meta name="lsc-version" content="">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<!-- First: the design tokens (ui-clarity). Every stylesheet below reads them. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/menu.css">

<link rel="stylesheet" href="css/send.css">
<!-- Late: the older screens' responsive bands. Every rule is inside a media
     query. -->
<link rel="stylesheet" href="css/responsive.css">
<!-- Last of all: the accessibility pass (contrast + focus rings). Overrides
     tokens/outlines the earlier files set, so it has to win every tie. -->
<link rel="stylesheet" href="css/a11y.css">
</head>
<body>

<!-- Login. Rendered by js/views/login.js; empty until the session check says
     there is no session. -->
<main id="login-view" hidden></main>

<!-- The app proper. The header is ported verbatim from the Electron build. -->
<div id="app-view" hidden>
  <!-- The shell (merged-admin L2, IA "Navigation Model"). js/shell.js drives it.
       Row one, sticky at every width: the wordmark (to the Dashboard), the two
       areas as real tabs, and the account menu. Row two, #app-subnav, is the
       active area's pages; it scrolls away with the page so every screen's
       "sticky under the 52px header" rule still holds. There is no compact
       menu: two tabs fit a phone. -->
  <header id="app-header">
    <a class="shell-mark" id="logo-btn" href="#/home" aria-label="LSC Creative, Dashboard"><span class="shell-mark-full" aria-hidden="true">LSC CREATIVE</span><span class="shell-mark-short" aria-hidden="true">LSC</span><em aria-hidden="true">.</em></a>
    <!-- Manual activation: arrows move focus, Enter or Space goes there, so an
         arrow key never trips the unsaved-edit prompt. -->
    <div class="shell-tabs" role="tablist" aria-label="Areas">
      <button type="button" class="shell-tab" role="tab" id="tab-sales" data-area="sales" aria-selected="false" aria-controls="app-subnav" tabindex="0">Scope &amp; Sales</button>
      <button type="button" class="shell-tab" role="tab" id="tab-clients" data-area="clients" aria-selected="false" aria-controls="app-subnav" tabindex="-1">Clients</button>
    </div>
    <div class="shell-utility">
      <!-- The Needs you count joins here when the queue is built. -->
      <span class="menu">
        <button type="button" class="shell-account menu-btn" id="acct-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-menu" aria-label="Account">
          <span class="shell-avatar" id="acct-initial" aria-hidden="true"></span>
          <span class="shell-account-name" id="acct-name" aria-hidden="true"></span>
          <span class="menu-caret" aria-hidden="true"></span>
        </button>
        <span class="menu-list" role="menu" id="acct-menu" aria-label="Account" hidden>
          <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="acct-settings"><span class="menu-text">Settings</span></button>
          <span class="menu-sep" role="separator"></span>
          <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="acct-sign-out"><span class="menu-text">Sign out</span><span class="menu-hint" id="acct-who"></span></button>
        </span>
      </span>
    </div>
  </header>

  <!-- The active area's pages. The tabs' panel; hidden on Settings, which
       belongs to neither area. Filled by js/shell.js. -->
  <div id="app-subnav" role="tabpanel" aria-labelledby="tab-sales" hidden></div>

  <!-- Raised by js/connection.js whenever the API is unreachable. role="status"
       so it is announced without stealing focus. -->
  <div id="connection-banner" role="status">
    <span class="cb-dot" aria-hidden="true"></span>
    <span id="connection-banner-message"></span>
    <button type="button" class="btn btn-sm" id="connection-banner-retry">Try Again</button>
  </div>

  <!-- Raised by js/update.js when the server has a newer version of the app
       than this tab is running. role="status", like the banner above. -->
  <div id="update-banner" role="status">
    <span class="cb-dot" aria-hidden="true"></span>
    <span id="update-banner-message">The app has been updated. Reload to use the new version.</span>
    <button type="button" class="btn btn-sm" id="update-banner-reload">Reload</button>
  </div>

  <!-- <main> so there is a main landmark once signed in: #login-view is the
       only other one and it is hidden by then. Every screen mounts here. -->
  <main id="main"></main>

  <!-- Dialogs, inside #app-view so they can never surface over the login
       screen. The first is Settings' "Preview with a project…". -->
  <div class="modal-overlay" id="modal-agreement-preview"></div>
  <div class="modal-overlay" id="modal-settings-confirm"></div>
  <div class="modal-overlay" id="modal-overhead-item"></div>
  <div class="modal-overlay" id="modal-depreciation-asset"></div>
  <div class="modal-overlay" id="modal-cost-breakdown"></div>
  <div class="modal-overlay" id="modal-add-day"></div>
  <div class="modal-overlay" id="modal-day-menu"></div>
  <div class="modal-overlay" id="modal-own-kit"></div>
  <div class="modal-overlay" id="modal-home-day"></div>
  <div class="modal-overlay" id="modal-project"></div>
  <div class="modal-overlay" id="modal-send"></div>
  <div class="modal-overlay" id="modal-share"></div>
  <div class="modal-overlay" id="modal-trip"></div>
</div>

<!-- Write feedback. role="status" so a successful save is announced without
     interrupting, and it never carries the only copy of a failure message. -->
<div class="export-toast" id="export-toast" role="status">
  <div class="toast-dot" id="toast-dot"></div>
  <div id="toast-msg"></div>
</div>
